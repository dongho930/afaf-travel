name: Selection log purge

# AI 플래너 추천·선택 기록(planner_selection_logs)은 질문 문장을 그대로 담아서
# 90일이 지나면 지웁니다. 다른 매일 작업과 같은 방식 — GitHub Actions 무료 스케줄로
# 백엔드의 정리 엔드포인트만 curl로 부릅니다.
on:
  schedule:
    # UTC 20:43 = KST 05:43. place-popularity-refresh(KST 05:33)와 10분 갈라뒀습니다.
    - cron: "43 20 * * *"
  workflow_dispatch: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Call selection-log purge endpoint
        run: |
          curl -fsS "https://afaf-travel.onrender.com/api/courses/selection-logs/purge"
