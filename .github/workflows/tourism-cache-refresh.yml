name: Tourism cache refresh

# 관광공사 API로 채우는 캐시를 매일 한 번 갱신합니다.
#
#   1) accessibility-summary : 홈 화면/접근성 탭의 '무장애 여행지 수'
#                              + 관광지 목록 캐시(attraction_list_cache)도 여기서
#                                함께 갱신됩니다 — 전수조사를 위해 카테고리별 목록을
#                                끝까지 받아오고, 온전히 받아온 카테고리만
#                                (_should_save_list_cache) 캐시에 씁니다.
#   2) congestion-cache      : 관광지 혼잡도(집중률) — 카드에 표시되는 %
#   3) overview-cache        : 홈 화면 '인기 여행지' 카드의 소개문
#   4) intro-cache           : 상세 페이지의 부가정보(이용시간/요금/주차 등)
#   5) related-cache         : 상세 페이지 '함께 가볼 만한 곳'
#   6) forecast-cache        : 상세 페이지의 날짜별 혼잡도
#
# 이 워크플로우가 관광공사 API를 부르는 유일한 통로입니다.
#
#   앱이 화면을 그릴 때는 저장된 캐시(DB)만 읽습니다 — 사용자 요청 경로에서
#   새로 조회하는 건수는 0건입니다(tour_api._NO_LIVE_FETCH). 목록 캐시도
#   유효기간이 지났다고 다시 받아오지 않고 오래된 것을 그대로 씁니다
#   (_LIST_CACHE_ANY_AGE_HOURS). 그래서 공공데이터포털이 죽어 있어도 화면은
#   그대로 뜨고, 응답 시간이 외부 API 상태와 무관하게 일정합니다.
#
#   뒤집어 말하면, 이 워크플로우가 며칠 연속 실패하면 데이터가 그만큼 낡습니다.
#   아래 Summary 표의 '목록 출처'와 '라이브 후보'가 0이면 목록 갱신이 실패한
#   것이니, 공공데이터포털 상태를 확인하세요.
#
#   예외 하나: 상세 페이지(/attractions/{id})는 캐시에 없는 관광지를 열었을 때만
#   그 한 곳을 즉시 조회합니다. 이게 없으면 아직 캐시에 없는 관광지는 상세 페이지가
#   아예 뜨지 않습니다(목록 1건당 최대 1회라 예산에도 거의 영향이 없습니다).
#
# Render Cron Job은 웹 서비스와 별도로 과금돼서(Starter 요금이 하나 더 붙음),
# 대신 GitHub Actions의 무료 스케줄 워크플로우로 백엔드의 refresh 엔드포인트만
# curl로 호출합니다 — 실제 계산은 백엔드(Render)에서 하고, 여긴 그냥 "지금 해줘"
# 신호만 보내는 역할이라 비용이 들지 않습니다.
# (region-popularity-refresh.yml과 같은 방식입니다)
#
# 왜 매일 돌려야 하나:
#   세 캐시 모두 관광공사 API 일일 트래픽 한도 안에서 조금씩만 채울 수 있습니다.
#   조회 결과는 DB에 영구 누적되므로, 매일 한 번씩 돌리면 아직 못 채운 곳이
#   메워집니다. 각 응답의 deferred_no_budget이 0이 되면 다 채워진 것입니다.
#
# 실행 순서가 정해져 있는 이유 (backend/app/config.py):
#   무장애 정보(detailWithTour2, 500건)와 소개문(detailCommon2, 500건)은 같은
#   일일 한도(1,000건)를 나눠 씁니다. 그래서 사용자에게 가장 중요한 무장애 통계를
#   먼저 돌리고, 소개문을 마지막에 돌립니다. 혼잡도는 별도 서비스
#   (TatsCnctrRateService, 200건)라 한도를 다투지 않습니다.

on:
  schedule:
    # UTC 15:00 = KST 00:00(자정). GitHub Actions 스케줄도 UTC 기준입니다.
    # 공공데이터포털 일일 한도가 KST 자정에 초기화되므로, 초기화 직후에 도는 셈입니다.
    # 참고: GitHub 스케줄은 부하가 몰리면 수 분~수십 분 늦게 실행될 수 있습니다
    # (정시 보장이 아님). 하루 한 번이면 되는 성격이라 문제되지 않습니다.
    - cron: "0 15 * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼으로도 바로 테스트 가능
    inputs:
      region:
        description: "갱신할 지역"
        required: false
        default: "경기도"

# 앞선 실행이 아직 안 끝났으면(전수조사가 길어질 수 있음) 겹쳐 돌리지 않습니다.
# 같은 계산을 동시에 두 번 하면 일일 트래픽 예산만 두 배로 씁니다.
concurrency:
  group: tourism-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 무장애 통계가 전수조사라 가장 오래 걸립니다. 재시도까지 감안해 넉넉히 잡습니다.
    timeout-minutes: 120
    env:
      BASE: https://afaf-travel.onrender.com/api/tourism
      REGION: ${{ github.event.inputs.region || '경기도' }}
    steps:
      - name: Refresh caches
        run: |
          set -uo pipefail

          # 셋 다 "GET 한 번 부르고 JSON 받기"라 공통 함수로 처리합니다.
          #   $1 이름(파일명/로그용)  $2 경로  $3 curl 최대 대기(초)  $4 재시도 간격(초)
          # 공공데이터포털이 응답하지 않는 날이 실제로 있어서(ReadTimeout) 재시도합니다.
          # 하나가 실패해도 나머지는 계속 시도합니다 — 서로 독립적인 캐시입니다.
          refresh() {
            local name="$1" path="$2" maxtime="$3" wait="$4" code=000
            echo "::group::$name 갱신 (region=$REGION)"
            for attempt in 1 2 3; do
              echo "시도 $attempt/3 ..."
              code=$(curl -sS -G --max-time "$maxtime" \
                --data-urlencode "region=$REGION" \
                -o "response-$name.json" -w '%{http_code}' "$BASE/$path") || code=000
              echo "HTTP $code"
              [ "$code" = "200" ] && break
              [ "$attempt" -lt 3 ] && { echo "${wait}초 뒤 재시도합니다."; sleep "$wait"; }
            done
            echo "$code" > "status-$name.txt"
            if [ "$code" = "200" ]; then
              echo "$name 갱신 성공"
            else
              echo "::warning::$name 갱신이 3회 모두 실패했습니다 (마지막 HTTP $code)."
            fi
            echo "::endgroup::"
          }

          # 1) 무장애 통계 — 전수조사라 가장 오래 걸립니다(수 분).
          refresh accessibility "accessibility-summary/refresh" 1800 300
          # 2) 혼잡도 — 시/군/구 단위 호출이라 훨씬 빠릅니다(경기도 약 44개).
          refresh congestion "congestion-cache/refresh" 900 120
          # 3) 소개문 — 무장애와 일일 한도를 공유하므로 마지막에 돌립니다.
          refresh overview "overview-cache/refresh" 900 120
          # 4) 부가정보(이용시간/요금/주차) — 소개문과 같은 일일 한도를 나눠 씁니다.
          refresh intro "intro-cache/refresh" 900 120
          # 5) 연관 관광지 / 6) 혼잡도 예보 — 위 셋과 다른 서비스라 별도 한도를 씁니다.
          refresh related "related-cache/refresh" 1800 120
          refresh forecast "forecast-cache/refresh" 1800 120

      - name: Summarize results
        if: always()
        run: |
          set -uo pipefail
          S="$GITHUB_STEP_SUMMARY"
          echo "## 관광 캐시 갱신 결과 (region: $REGION)" >> "$S"

          status() { [ -f "status-$1.txt" ] && cat "status-$1.txt" || echo "미실행"; }

          # --- 1) 무장애 통계 ---
          # 숫자가 안 오를 때 원인을 여기서 구분할 수 있습니다:
          #   live_candidates 0        -> 공공데이터포털 목록 API 장애
          #   deferred_no_budget > 0   -> 일일 예산 소진, 내일 이어서 채워짐
          #   list_cache_restored 있음 -> 목록 캐시가 복구됨 (회복 신호)
          echo "" >> "$S"
          echo "### 1. 무장애 통계 (HTTP $(status accessibility))" >> "$S"
          if [ -f response-accessibility.json ] && jq -e . response-accessibility.json >/dev/null 2>&1; then
            jq -r '
              "| 항목 | 값 |", "| --- | --- |",
              "| 무장애 여행지 수 | **\(.total_accessible_count)** |",
              "| 휠체어 | \(.wheelchair_count) |",
              "| 시각 / 청각 | \(.visual_count) / \(.hearing_count) |",
              "| 영유아가족 / 임산부 | \(.family_count) / \(.pregnant_count) |",
              "| 후보 수 | \(.total_candidates) |",
              "| 목록 출처 | `\(.debug.list_source // "-")` |",
              "| 라이브 후보 / 캐시 보충 | \(.debug.live_candidates // "-") / \(.debug.candidates_only_from_cache // "-") |",
              "| 목록 캐시 복구 | \(.debug.list_cache_restored // [] | tostring) |",
              "| 목록 잘림 | \(.debug.list_fetch // {} | tostring) |",
              "| 예산 부족으로 미룸 | \(.debug.accessibility_fetch.deferred_no_budget // "-") |",
              "| 캐시 적중 / 신규 조회 | \(.debug.accessibility_fetch.from_cache // "-") / \(.debug.accessibility_fetch.newly_fetched_and_cached // "-") |"
            ' response-accessibility.json >> "$S"
          else
            echo "응답을 해석하지 못했습니다." >> "$S"
          fi

          # --- 2) 혼잡도 ---
          echo "" >> "$S"
          echo "### 2. 혼잡도 캐시 (HTTP $(status congestion))" >> "$S"
          if [ -f response-congestion.json ] && jq -e . response-congestion.json >/dev/null 2>&1; then
            jq -r '
              "| 항목 | 값 |", "| --- | --- |",
              "| 전체 시/군/구 | \(.total_signgu // "-") |",
              "| 이미 캐시됨 | \(.already_cached_signgu // "-") |",
              "| 이번에 조회 | \(.signgu_fetched_this_run // "-") |",
              "| 예산 부족으로 미룸 | \(.deferred_no_budget // "-") |"
            ' response-congestion.json >> "$S"
          else
            echo "응답을 해석하지 못했습니다." >> "$S"
          fi

          # --- 3) 소개문 ---
          echo "" >> "$S"
          echo "### 3. 소개문 캐시 (HTTP $(status overview))" >> "$S"
          if [ -f response-overview.json ] && jq -e . response-overview.json >/dev/null 2>&1; then
            jq -r '
              "| 항목 | 값 |", "| --- | --- |",
              "| 후보 수 | \(.total_candidates // "-") |",
              "| 새로 채운 소개문 | \(.diag.fetched // "-") |",
              "| 예산 부족으로 미룸 | \(.diag.deferred_no_budget // "-") |"
            ' response-overview.json >> "$S"
          else
            echo "응답을 해석하지 못했습니다." >> "$S"
          fi

          # --- 4) 부가정보 ---
          echo "" >> "$S"
          echo "### 4. 부가정보 캐시 (HTTP $(status intro))" >> "$S"
          if [ -f response-intro.json ] && jq -e . response-intro.json >/dev/null 2>&1; then
            jq -r '
              "| 항목 | 값 |", "| --- | --- |",
              "| 후보 수 | \(.total_candidates // "-") |",
              "| 이미 캐시됨 | \(.diag.from_cache // "-") |",
              "| 새로 채운 부가정보 | \(.diag.newly_fetched_and_cached // "-") |",
              "| 예산 부족으로 미룸 | \(.diag.deferred_no_budget // "-") |"
            ' response-intro.json >> "$S"
          else
            echo "응답을 해석하지 못했습니다." >> "$S"
          fi

          # --- 5) 연관 관광지 / 6) 혼잡도 예보 ---
          for name in related forecast; do
            case "$name" in
              related)  title="5. 연관 관광지 캐시" ;;
              forecast) title="6. 혼잡도 예보 캐시" ;;
            esac
            echo "" >> "$S"
            echo "### $title (HTTP $(status "$name"))" >> "$S"
            if [ -f "response-$name.json" ] && jq -e . "response-$name.json" >/dev/null 2>&1; then
              jq -r '
                "| 항목 | 값 |", "| --- | --- |",
                "| 후보 수 | \(.total_candidates // "-") |",
                "| 이미 캐시됨 | \(.already_cached // "-") |",
                "| 새로 캐시 | \(.newly_cached // "-") |",
                "| 예산 부족으로 미룸 | \(.deferred_no_budget // "-") |"
              ' "response-$name.json" >> "$S"
            else
              echo "응답을 해석하지 못했습니다." >> "$S"
            fi
          done

      - name: Fail if any refresh failed
        if: always()
        run: |
          set -uo pipefail
          failed=""
          for name in accessibility congestion overview; do
            code=$(cat "status-$name.txt" 2>/dev/null || echo "미실행")
            [ "$code" = "200" ] || failed="$failed $name(HTTP $code)"
          done
          if [ -n "$failed" ]; then
            echo "::error::갱신 실패:$failed"
            exit 1
          fi
          echo "3종 모두 갱신 성공."
