name: Accessibility stats refresh

# 홈 화면/접근성 탭의 '무장애 여행지 수'를 매일 다시 계산하기 위한 트리거입니다.
#
# Render Cron Job은 웹 서비스와 별도로 과금돼서(Starter 요금이 하나 더 붙음),
# 대신 GitHub Actions의 무료 스케줄 워크플로우로 백엔드의 refresh 엔드포인트만
# curl로 호출합니다 — 실제 계산은 백엔드(Render)에서 하고, 여긴 그냥 "지금 해줘"
# 신호만 보내는 역할이라 비용이 들지 않습니다.
# (region-popularity-refresh.yml과 같은 방식입니다)
#
# 왜 매일 돌려야 하나:
#   무장애 정보는 장소 하나하나를 조회해야 알 수 있는데, 공공데이터포털 일일
#   트래픽 한도 때문에 한 번에 500곳(TOUR_API_DAILY_FETCH_BUDGET)까지만 새로
#   조회할 수 있습니다. 조회한 결과는 DB에 영구 누적되므로, 매일 한 번씩
#   돌리면 아직 못 채운 곳이 조금씩 메워집니다. 응답의
#   debug.accessibility_fetch.deferred_no_budget이 0이 되면 다 채워진 것입니다.

on:
  schedule:
    # UTC 15:00 = KST 00:00(자정). GitHub Actions 스케줄도 UTC 기준입니다.
    # 공공데이터포털 일일 한도가 KST 자정에 초기화되므로, 초기화 직후에 도는 셈입니다.
    # 참고: GitHub 스케줄은 부하가 몰리면 수 분~수십 분 늦게 실행될 수 있습니다
    # (정시 보장이 아님). 이 작업은 하루 한 번이면 되는 성격이라 문제되지 않습니다.
    - cron: "0 15 * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼으로도 바로 테스트 가능
    inputs:
      region:
        description: "갱신할 지역"
        required: false
        default: "경기도"

# 앞선 실행이 아직 안 끝났으면(전수조사가 길어질 수 있음) 겹쳐 돌리지 않습니다.
# 같은 계산을 동시에 두 번 하면 일일 트래픽 예산만 두 배로 씁니다.
concurrency:
  group: accessibility-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 전수조사라 수 분 걸립니다. 재시도까지 감안해 넉넉히 잡습니다.
    timeout-minutes: 90
    steps:
      - name: Call accessibility-summary refresh endpoint
        env:
          REGION: ${{ github.event.inputs.region || '경기도' }}
        run: |
          set -uo pipefail
          BASE="https://afaf-travel.onrender.com/api/tourism/accessibility-summary/refresh"

          # 공공데이터포털이 응답하지 않는 날이 실제로 있어서(ReadTimeout) 재시도합니다.
          # 백엔드가 이미 페이지 단위 재시도를 하므로, 여기서는 크게 세 번만 시도합니다.
          code=000
          for attempt in 1 2 3; do
            echo "::group::시도 $attempt/3 (region=$REGION)"
            code=$(curl -sS -G --max-time 1800 \
              --data-urlencode "region=$REGION" \
              -o response.json -w '%{http_code}' "$BASE") || code=000
            echo "HTTP $code"
            echo "::endgroup::"
            [ "$code" = "200" ] && break
            [ "$attempt" -lt 3 ] && { echo "5분 뒤 재시도합니다."; sleep 300; }
          done

          if [ "$code" != "200" ]; then
            echo "::error::갱신 호출이 3회 모두 실패했습니다 (마지막 HTTP $code)."
            exit 1
          fi

      - name: Summarize result
        if: always() && hashFiles('response.json') != ''
        run: |
          set -uo pipefail
          # 이번 갱신이 어떻게 됐는지 Actions 요약 화면에서 바로 보이게 남깁니다.
          # 숫자가 안 오르면 여기 debug 값으로 원인을 구분할 수 있습니다:
          #   live_candidates 0        -> 공공데이터포털 목록 API 장애
          #   deferred_no_budget > 0   -> 일일 예산 소진, 내일 이어서 채워짐
          #   list_cache_restored 있음 -> 목록 캐시가 복구됨
          jq -r '
            "## 무장애 통계 갱신 결과",
            "",
            "| 항목 | 값 |",
            "| --- | --- |",
            "| 무장애 여행지 수 | **\(.total_accessible_count)** |",
            "| 휠체어 | \(.wheelchair_count) |",
            "| 시각 / 청각 | \(.visual_count) / \(.hearing_count) |",
            "| 영유아가족 / 임산부 | \(.family_count) / \(.pregnant_count) |",
            "| 후보 수 | \(.total_candidates) |",
            "| 목록 출처 | `\(.debug.list_source // "-")` |",
            "| 라이브 후보 / 캐시 보충 | \(.debug.live_candidates // "-") / \(.debug.candidates_only_from_cache // "-") |",
            "| 목록 캐시 복구 | \(.debug.list_cache_restored // [] | tostring) |",
            "| 목록 잘림 | \(.debug.list_fetch // {} | tostring) |",
            "| 예산 부족으로 미룸 | \(.debug.accessibility_fetch.deferred_no_budget // "-") |",
            "| 캐시 적중 / 신규 조회 | \(.debug.accessibility_fetch.from_cache // "-") / \(.debug.accessibility_fetch.newly_fetched_and_cached // "-") |"
          ' response.json >> "$GITHUB_STEP_SUMMARY" || {
            echo "응답을 해석하지 못했습니다. 원본 앞부분:" >> "$GITHUB_STEP_SUMMARY"
            head -c 500 response.json >> "$GITHUB_STEP_SUMMARY"
          }
