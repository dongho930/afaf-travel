<!DOCTYPE html>
<!--
  웹에서만 쓰이는 HTML 껍데기입니다 (앱에는 영향 없음).
  Expo 기본 템플릿에 폰트 스타일시트 두 줄을 더한 것이 전부입니다. 아래 퍼센트로
  둘러싸인 자리표시자(언어/제목)는 Expo가 빌드할 때 app.json 설정으로 채워주고,
  스크립트와 파비콘 태그도 그때 자동으로 들어갑니다.
  주의: 자리표시자는 파일에서 처음 나오는 것 하나만 치환되므로, 이 주석에는
  그 이름을 그대로 적지 않습니다(적으면 진짜 자리표시자가 안 채워집니다).

  폰트를 이렇게 CSS로 부르는 이유:
  예전에는 expo-font가 실행 중에 Pretendard OTF 5개(합계 약 7.5MB)를 다 받을 때까지
  화면에 아무것도 그리지 않았습니다. 이 CSS는 글자 범위별로 잘게 나뉜 파일을 가리켜서
  화면에 실제로 나온 글자가 든 조각만 받고(조각당 약 18KB), font-display: swap이라
  폰트를 기다리지 않고 기본 글꼴로 먼저 보여준 뒤 바꿔 낍니다.
  (CSS 자체는 scripts/generate-web-fonts-css.js가 만들어 public/fonts에 둡니다)
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!-- 폰트 조각을 받아올 CDN에 미리 연결해둬서 글자가 조금이라도 빨리 제 글꼴로 바뀌게 합니다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="/fonts/pretendard.css" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
