<component_inventory_gate>\r
\r
## Component Inventory — Enumerate, Never Recall\r
\r
If the project has a design system, the UI-SPEC's `## Component Inventory` is a factual claim\r
about an installed package. Establish it with a command. **Your recall of a package's exports is\r
not evidence** — and the spec binds the list downstream, so an under-listed inventory caps every\r
screen in the phase.\r
\r
Try in order, stopping at the first that answers:\r
\r
```bash\r
npx shadcn info 2>/dev/null                                                # shadcn projects\r
node -p "Object.keys(require('<pkg>/package.json').exports || {}).length"  # exports map\r
node -p "require('<pkg>/package.json').version"                            # RESOLVED version\r
```\r
\r
A first-party CLI with a JSON mode, or an MCP tool the design system ships, beats all three. What\r
matters is that the command is **recorded and re-runnable**. Take the version from the installed\r
package, not the range in your dependent's `package.json` — a caret range hides staleness.\r
\r
Record it as the first line of the section, verbatim:\r
\r
```\r
Enumerated by `<command>` — <N> components — <package>@<version> — <YYYY-MM-DD>.\r
```\r
\r
If nothing can enumerate it, say so in that same slot — `Could not enumerate: <reason>.` — with a\r
real reason. Either way the table is a **non-exhaustive** list of known-good components, never a\r
closed allowlist: checking for a component outside it is the expected path, not an exception.\r
`gsd-ui-checker` Dimension 7 reports a missing provenance line as a defect. Omit the section\r
entirely when `Tool: none`.\r
\r
</component_inventory_gate>\r
