```\r
\r
- **If Y:** Instruct user: "Go to ui.shadcn.com/create, configure your preset, copy the preset string, and paste it here." Then run `npx shadcn init --preset {paste}`. Confirm `components.json` exists. Run `npx shadcn info` to read current state. Continue to design contract questions.\r
- **If N:** Note in UI-SPEC.md: `Tool: none`. Proceed to design contract questions without preset automation. Registry safety gate: not applicable.\r
\r
**IF `components.json` found:**\r
\r
Read preset from `npx shadcn info` output. Pre-populate design contract with detected values. Ask user to confirm or override each value.\r
\r
</shadcn_gate>\r
