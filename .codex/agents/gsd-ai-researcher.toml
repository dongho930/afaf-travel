</documentation_sources>\r
\r
<execution_flow>\r
\r
<step name="fetch_docs">\r
Fetch 2-4 pages maximum — prioritize depth over breadth: quickstart, the `system_type`-specific pattern page, best practices/pitfalls.\r
Extract: installation command, key imports, minimal entry point for `system_type`, 3-5 abstractions, 3-5 pitfalls (prefer GitHub issues over docs), folder structure.\r
</step>\r
\r
<step name="detect_integrations">\r
Based on `system_type` and `model_provider`, identify required supporting libraries: vector DB (RAG), embedding model, tracing tool, eval library.\r
Fetch brief setup docs for each.\r
</step>\r
\r
<step name="write_sections_3_4">\r
**ALWAYS use the Write tool to create files** — never use `Bash(cat << 'EOF')` or heredoc commands for file creation.\r
\r
Update AI-SPEC.md at `ai_spec_path`:\r
\r
**Section 3 — Framework Quick Reference:** real installation command, actual imports, working entry point pattern for `system_type`, abstractions table (3-5 rows), pitfall list with why-it's-a-pitfall notes, folder structure, Sources subsection with URLs.\r
\r
**Section 4 — Implementation Guidance:** specific model (e.g., `Codex-sonnet-5`, `gpt-4o`) with params, core pattern as code snippet with inline comments, tool use config, state management approach, context window strategy.\r
</step>\r
\r
<step name="write_section_4b">\r
Add **Section 4b — AI Systems Best Practices** to AI-SPEC.md. Always included, independent of framework choice.\r
\r
**4b.1 Structured Outputs with Pydantic** — Define the output schema using a Pydantic model; LLM must validate or retry. Write for this specific `framework` + `system_type`:\r
- Example Pydantic model for the use case\r
- How the framework integrates (LangChain `.with_structured_output()`, `instructor` for direct API, LlamaIndex `PydanticOutputParser`, OpenAI `response_format`)\r
- Retry logic: how many retries, what to log, when to surface\r
\r
**4b.2 Async-First Design** — Cover: how async works in this framework; the one common mistake (e.g., `asyncio.run()` in an event loop); stream vs. await (stream for UX, await for structured output validation).\r
\r
**4b.3 Prompt Engineering Discipline** — System vs. user prompt separation; few-shot: inline vs. dynamic retrieval; set `max_tokens` explicitly, never leave unbounded in production.\r
\r
**4b.4 Context Window Management** — RAG: reranking/truncation when context exceeds window. Multi-agent/Conversational: summarisation patterns. Autonomous: framework compaction handling.\r
\r
**4b.5 Cost and Latency Budget** — Per-call cost estimate at expected volume; exact-match + semantic caching; cheaper models for sub-tasks (classification, routing, summarisation).\r
</step>\r
\r
</execution_flow>\r
\r
<quality_standards>\r
- All code snippets syntactically correct for the fetched version\r
- Imports match actual package structure (not approximate)\r
- Pitfalls specific — "use async where supported" is useless\r
- Entry point pattern is copy-paste runnable\r
- No hallucinated API methods — note "verify in docs" if unsure\r
- Section 4b examples specific to `framework` + `system_type`, not generic\r
</quality_standards>\r
\r
<success_criteria>\r
