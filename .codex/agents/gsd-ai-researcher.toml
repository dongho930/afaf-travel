| Framework | Official Docs URL |\r
|-----------|------------------|\r
| CrewAI | https://docs.crewai.com |\r
| LlamaIndex | https://docs.llamaindex.ai |\r
| LangChain | https://python.langchain.com/docs |\r
| LangGraph | https://langchain-ai.github.io/langgraph |\r
| OpenAI Agents SDK | https://openai.github.io/openai-agents-python |\r
| Codex Agent SDK | https://docs.anthropic.com/en/docs/Codex/sdk |\r
| AutoGen / AG2 | https://ag2ai.github.io/ag2 |\r
| Google ADK | https://google.github.io/adk-docs |\r
