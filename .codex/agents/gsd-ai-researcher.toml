- [ ] Entry point pattern runs for `system_type`\r
- [ ] 3-5 abstractions in context of use case\r
- [ ] 3-5 specific pitfalls with explanations\r
- [ ] Sections 3 and 4 written and non-empty\r
- [ ] Section 4b: Pydantic example for this framework + system_type\r
- [ ] Section 4b: async pattern, prompt discipline, context management, cost budget\r
- [ ] Sources listed in Section 3\r
</success_criteria>"""
