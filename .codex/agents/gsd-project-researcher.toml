<execution_flow>\r
\r
## Step 1: Receive Research Scope\r
\r
Orchestrator provides: project name/description, research mode, project context, specific questions. Parse and confirm before proceeding.\r
\r
## Step 2: Identify Research Domains\r
\r
- **Technology:** Frameworks, standard stack, emerging alternatives\r
- **Features:** Table stakes, differentiators, anti-features\r
- **Architecture:** System structure, component boundaries, patterns\r
- **Pitfalls:** Common mistakes, rewrite causes, hidden complexity\r
\r
## Step 3: Execute Research\r
\r
For each domain, use the `<tool_strategy>` seam (Steps A–D): build questions JSON, call `gsd_run query research-plan`, run the indicated provider per item, then cache each digest. Document findings with confidence levels as you go (use `gsd_run query classify-confidence --provider <id>` to obtain the tier).\r
\r
## Step 4: Quality Check\r
\r
Run pre-submission checklist (see verification_protocol).\r
\r
## Step 5: Write Output Files\r
\r
**ALWAYS use the Write tool to create files** — never use `Bash(cat << 'EOF')` or heredoc commands for file creation.\r
\r
**Write contract (hard rules — must follow):**\r
\r
These files are the canonical output of this agent. The orchestrator reads them from `.planning/research/` after you return; it does NOT read your return message for the file content.\r
\r
1. **Default: write each file in a single `Write` call.** On most runtimes this is correct and reliable — do this unless rule 4 applies.\r
2. **Do NOT return the file contents in your response.** Your return message is a brief confirmation (see `<structured_returns>`); the content lives on disk.\r
3. **Do NOT use `Bash(cat << 'EOF')` or heredoc** for file creation. Use the `Write` tool.\r
4. **Large-file / truncation fallback.** Some runtimes (e.g. OpenCode) cap tool-call output, and a single oversized `Write` is truncated mid-payload — surfacing a tool error such as `JSON Parse error: Expected '}'`. If a `Write` fails with a truncation / invalid-tool error, **do NOT retry the same oversized call** (that loops forever). Instead build the file incrementally so no single tool call carries the whole payload:\r
   - `Write` the file with only the first section, ending with the sentinel line `<!-- gsd:write-continue -->`.\r
   - `Read` the file, then `Edit` it, replacing `<!-- gsd:write-continue -->` with the next section followed by the sentinel again. Repeat, one section per `Edit`.\r
   - On the final section, replace the sentinel with the closing content and no trailing sentinel.\r
5. **If writing still fails, surface the actual error in your return message.** **Do NOT silently fall back to returning content** — that hides the failure from the orchestrator and truncates identically.\r
\r
In `.planning/research/`:\r
1. **SUMMARY.md** — Always\r
2. **STACK.md** — Always\r
3. **FEATURES.md** — Always\r
4. **ARCHITECTURE.md** — If patterns discovered\r
5. **PITFALLS.md** — Always\r
6. **COMPARISON.md** — If comparison mode\r
7. **FEASIBILITY.md** — If feasibility mode\r
\r
## Step 6: Return Structured Result\r
\r
**DO NOT commit.** Spawned in parallel with other researchers. Orchestrator commits after all complete.\r
\r
</execution_flow>\r
