<tool_strategy>\r
\r
## Research Plan via Code Seam\r
\r
The agent decides **what** to research (the questions). The seam decides **which provider** to use and manages caching.\r
\r
### Step A — Build a research-plan input file\r
\r
Construct a JSON file at a temp path (e.g. `/tmp/research-plan-input.json`):\r
\r
```json\r
{\r
  "ecosystem": "<npm|pypi|crates|...>",\r
  "config": { "exa_search": true/false, "brave_search": true/false, "firecrawl": true/false, "tavily_search": true/false },\r
  "questions": [\r
    { "text": "How does X work?", "kind": "docs", "library": "x", "version": "1.2.3" },\r
    { "text": "Best practices for Y?", "kind": "web" }\r
  ]\r
}\r
```\r
\r
`config` comes from the init context (availability flags). `kind` is `"docs"` for library/API questions, `"web"` for ecosystem/community questions, `"scrape"` when you have a specific URL to extract.\r
\r
### Step B — Obtain the fetch plan\r
\r
```bash\r
_GSD_SHIM_NAME="gsd-tools.cjs"; _GSD_RUNTIME_ROOT="${RUNTIME_DIR:-$(git rev-parse --show-toplevel 2>/dev/null || pwd)}"; GSD_TOOLS="${_GSD_RUNTIME_ROOT}/gsd-core/bin/${_GSD_SHIM_NAME}"; _gsd_at() { for _p; do if [ -f "$_p" ]; then GSD_TOOLS="$_p"; return 0; fi; done; return 1; }; if _gsd_at "${_GSD_RUNTIME_ROOT}/gsd-core/bin/${_GSD_SHIM_NAME}" "${_GSD_RUNTIME_ROOT}/.Codex/gsd-core/bin/${_GSD_SHIM_NAME}" "${_GSD_RUNTIME_ROOT}/.codex/gsd-core/bin/${_GSD_SHIM_NAME}"; then gsd_run() { node "$GSD_TOOLS" "$@"; }; elif unset -f gsd_run; _G="$(command -v gsd_run)"; then GSD_TOOLS="$_G"; gsd_run() { "$GSD_TOOLS" "$@"; }; elif _gsd_at "${CLAUDE_CONFIG_DIR:-C:/Users/zakuv/Downloads/afaf-travel-planner/afaf-travel/.Codex}/gsd-core/bin/${_GSD_SHIM_NAME}" "${HERMES_HOME:-$HOME/.hermes}/gsd-core/bin/${_GSD_SHIM_NAME}" "${CURSOR_CONFIG_DIR:-$HOME/.cursor}/gsd-core/bin/${_GSD_SHIM_NAME}" "${CODEX_HOME:-$HOME/.codex}/gsd-core/bin/${_GSD_SHIM_NAME}" "${GEMINI_CONFIG_DIR:-$HOME/.gemini}/gsd-core/bin/${_GSD_SHIM_NAME}" "${COPILOT_CONFIG_DIR:-$HOME/.copilot}/gsd-core/bin/${_GSD_SHIM_NAME}" "${WINDSURF_CONFIG_DIR:-$HOME/.codeium/windsurf}/gsd-core/bin/${_GSD_SHIM_NAME}" "${AUGMENT_CONFIG_DIR:-$HOME/.augment}/gsd-core/bin/${_GSD_SHIM_NAME}" "${TRAE_CONFIG_DIR:-$HOME/.trae}/gsd-core/bin/${_GSD_SHIM_NAME}" "${QWEN_CONFIG_DIR:-$HOME/.qwen}/gsd-core/bin/${_GSD_SHIM_NAME}" "${CODEBUDDY_CONFIG_DIR:-$HOME/.codebuddy}/gsd-core/bin/${_GSD_SHIM_NAME}" "${CLINE_CONFIG_DIR:-$HOME/.cline}/gsd-core/bin/${_GSD_SHIM_NAME}" "${GROK_AGENTS_HOME:-$HOME/.agents}/gsd-core/bin/${_GSD_SHIM_NAME}" "${ANTIGRAVITY_CONFIG_DIR:-$HOME/.gemini/antigravity}/gsd-core/bin/${_GSD_SHIM_NAME}" "${OPENCODE_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/opencode}/gsd-core/bin/${_GSD_SHIM_NAME}" "${KILO_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/kilo}/gsd-core/bin/${_GSD_SHIM_NAME}"; then gsd_run() { node "$GSD_TOOLS" "$@"; }; else echo "ERROR: gsd-tools.cjs not found at $GSD_TOOLS and gsd_run is not on PATH. Run: npx -y @opengsd/gsd-core@latest --Codex --local" >&2; exit 1; fi; GSD_IDENTITY_STATUS=unverified; case "$(gsd_run runtime-identity --raw 2>/dev/null || true)" in '{"packageName":"@opengsd/gsd-core"'*'}') GSD_IDENTITY_STATUS=ok;; esac; export GSD_IDENTITY_STATUS; [ "$GSD_IDENTITY_STATUS" = ok ] || echo "WARNING: \\"$GSD_TOOLS\\" did not prove it is @opengsd/gsd-core - it is either a different package or an @opengsd/gsd-core older than the runtime-identity verb. See docs/how-to/diagnose-a-foreign-gsd-tools.md" >&2; if [ -n "${CLAUDE_ENV_FILE:-}" ] && [ -n "${GSD_TOOLS:-}" ]; then printf "export PATH='%s':\\"\\$PATH\\"\\n" "${GSD_TOOLS%/*}" >> "$CLAUDE_ENV_FILE" 2>/dev/null || true; fi\r
gsd_run query research-plan --input /tmp/research-plan-input.json\r
```\r
\r
Returns `{ "items": [ { "question": "...", "key": "<sha256>", "cache": { "hit": true/false, "stale": false }, "fetch": { "provider": "context7", "query": "..." } } ] }`.\r
\r
- `cache.hit && !cache.stale` → reuse the cached digest; no fetch needed.\r
- `cache.hit && cache.stale` → fetch anyway to refresh; the old entry is returned as a fallback.\r
- no `cache` field → cache miss; must fetch.\r
\r
### Step C — Execute the indicated fetch\r
\r
For each item where `fetch` is present, invoke the MCP tool matching `fetch.provider`:\r
\r
| provider id | MCP tool / built-in |\r
|-------------|---------------------|\r
| `context7` | `mcp__context7__resolve-library-id` then `mcp__context7__query-docs` |\r
| `ref` | `mcp__ref__*` (use the appropriate ref MCP tool for the query) |\r
| `jina` | `mcp__jina__*` (use the appropriate jina MCP tool for the query) |\r
| `exa` | `mcp__exa__web_search_exa` with `fetch.query` |\r
| `tavily` | `mcp__tavily__search` with `fetch.query` |\r
| `perplexity` | `mcp__perplexity__*` (use the appropriate perplexity MCP tool for the query) |\r
| `brave` | `gsd_run query websearch "<fetch.query>"` (Brave-backed) or built-in `WebSearch` |\r
| `firecrawl` | `mcp__firecrawl__scrape` with url (scrape kind) or `mcp__firecrawl__search` |\r
| `websearch` | built-in `WebSearch` tool |\r
| `webfetch` | built-in `WebFetch` tool |\r
\r
For any other provider id `X` not listed above: use `mcp__X__*` if available, else fall back to `WebSearch`.\r
\r
**WebSearch tip:** Do not inject a year into queries — it biases results toward stale dated content; check publication dates on the results you read instead.\r
\r
### Step D — Cache each digest\r
\r
After digesting a source, persist it so future runs can reuse it:\r
\r
```bash\r
gsd_run query research-store put <key> \\\r
  --content "<one-paragraph digest>" \\\r
  --source <curated|web> \\\r
  --provider <provider-id> \\\r
  --confidence <HIGH|MEDIUM|LOW> \\\r
  --kind <docs|web>\r
```\r
\r
`key` comes from the `research-plan` item. `confidence` comes from the classify-confidence seam (see `<source_hierarchy>`).\r
\r
</tool_strategy>\r
