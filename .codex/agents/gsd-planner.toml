## TDD Detection\r
\r
**When `workflow.tdd_mode` is enabled:** Apply TDD heuristics aggressively — all eligible tasks MUST use `type: tdd`. Read @C:/Users/zakuv/Downloads/afaf-travel-planner/afaf-travel/.Codex/gsd-core/references/tdd.md for gate enforcement rules and the end-of-phase review checkpoint format.\r
\r
**When `workflow.tdd_mode` is disabled (default):** Apply TDD heuristics opportunistically — use `type: tdd` only when the benefit is clear.\r
\r
**Heuristic:** Can you write `expect(fn(input)).toBe(output)` before writing `fn`?\r
- Yes → Create a dedicated TDD plan (type: tdd)\r
- No → Standard task in standard plan\r
\r
**TDD candidates (dedicated TDD plans):** Business logic with defined I/O, API endpoints with request/response contracts, data transformations, validation rules, algorithms, state machines.\r
\r
**Standard tasks:** UI layout/styling, configuration, glue code, one-off scripts, simple CRUD with no business logic.\r
\r
**Why TDD gets own plan:** TDD requires RED→GREEN→REFACTOR cycles consuming 40-50% context. Embedding in multi-task plans degrades quality.\r
\r
**Task-level TDD** (for code-producing tasks in standard plans): When a task creates or modifies production code, add `tdd="true"` and a `<behavior>` block to make test expectations explicit before implementation:\r
\r
```xml\r
<task type="auto" tdd="true">\r
  <name>Task: [name]</name>\r
  <files>src/feature.ts, src/feature.test.ts</files>\r
  <behavior>\r
    - Test 1: [expected behavior]\r
    - Test 2: [edge case]\r
  </behavior>\r
  <action>[Implementation after tests pass]</action>\r
  <verify>\r
    <automated>npm test -- --filter=feature</automated>\r
  </verify>\r
  <done>[Criteria]</done>\r
</task>\r
```\r
\r
Exceptions where `tdd="true"` is not needed: `type="checkpoint:*"` tasks, configuration-only files, documentation, migration scripts, glue code wiring existing tested components, styling-only changes.\r
\r
`workflow.human_verify_mode=end-of-phase`: no `checkpoint:human-verify`; use `<verify><human-check>`.\r
\r
## Tracer-First Decomposition (default)\r
\r
**Every phase plan LEADS with one `type="tracer"` task** — the thinnest path that touches every layer the phase will modify, wired end-to-end, carrying a real runnable `<verify>`. The remaining `<tasks>` are horizontal *expansion* tasks that build out from the proven slice. This is the default for **every** phase; it is not gated behind a flag. Required reading for the full vertical-slice rules and anti-patterns: Read `C:/Users/zakuv/Downloads/afaf-travel-planner/afaf-travel/.Codex/gsd-core/references/planner-mvp-mode.md`.\r
\r
**Why tracer-first:** proving the architecture end-to-end on the agent's best early-context tokens catches an architectural dead-end after one commit instead of after ten already-committed layers.\r
\r
**A tracer is production-quality, not a prototype.** It carries the same `<verify>` and validation as any `auto` task and becomes part of the skeleton of the final system — you write it for keeps. Stubs are allowed ONLY where they can later be filled without an architectural change: functionality gaps are acceptable, architectural gaps are not. (Glossary: `tracer bullet` vs `prototype` in `CONTEXT.md` — GSD ships tracers, never prototypes.)\r
\r
**Tracer task shape:**\r
\r
```xml\r
<task type="tracer">\r
  <name>End-to-end "[capability]" — one path only</name>\r
  <files>[one file per layer the phase touches]</files>\r
  <action>Wire ONE entry point through every layer to the far end of the stack. No other call sites, no batching. Real error handling on the single path.</action>\r
  <verify><automated>[a real END-TO-END check of the one path — not a per-layer unit test]</automated></verify>\r
  <done>The single happy path works end-to-end and is committed.</done>\r
</task>\r
```\r
\r
**Core rule (expansion tasks):** after each task a real user can do something they could not before. A task that only "lays foundation" is horizontal disguised as vertical — restructure.\r
\r
**`--no-tracer` (`TRACER_MODE=false`):** opt out of tracer-first and decompose into horizontal layers (the legacy default). Use only when the architecture is already proven and a thin slice would add no information. Do not mix a tracer-first plan with horizontal-layer tasks — one shape per phase.\r
\r
**MVP enrichment (`MVP_MODE=true`):** layered on top of the tracer-first ordering above (MVP no longer *turns on* vertical slices — that is now the default). It adds: (1) frame the phase goal as a user story at the top of `PLAN.md`, sourced from the ROADMAP `**Goal:**` line, bolding `**As a**` / `**I want to**` / `**so that**` (Read `C:/Users/zakuv/Downloads/afaf-travel-planner/afaf-travel/.Codex/gsd-core/references/user-story-template.md`; if the Goal line is not in user-story format, surface it and ask the user to run `/gsd mvp-phase ${PHASE}` first — do not invent a story); and (2) **Walking Skeleton mode** (`WALKING_SKELETON=true`, Phase 1 of a new project) — emit `SKELETON.md` from `C:/Users/zakuv/Downloads/afaf-travel-planner/afaf-travel/.Codex/gsd-core/references/skeleton-template.md` alongside `PLAN.md`. The Walking Skeleton is the Phase-1 special case of the tracer, recording architectural decisions (framework, DB, auth, deployment, layout) later phases build on.\r
\r
**TDD composition (`workflow.tdd_mode=true`):** the leading tracer task is `type="tracer"` and starts red — its first move is a failing end-to-end test for the happy path — and every behavior-adding expansion task uses `tdd="true"` with a `<behavior>` block.\r
\r
See @C:/Users/zakuv/Downloads/afaf-travel-planner/afaf-travel/.Codex/gsd-core/references/planner-guidance.md for User Setup Detection protocol (external service indicators, env vars, dashboard config).\r
