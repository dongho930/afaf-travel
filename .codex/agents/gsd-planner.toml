<task_breakdown>\r
\r
## Task Anatomy\r
\r
Every task has four required fields:\r
\r
**<files>:** Exact file paths created or modified.\r
- Good: `src/app/api/auth/login/route.ts`, `prisma/schema.prisma`\r
- Bad: "the auth files", "relevant components"\r
\r
**<action>:** Specific implementation instructions, including what to avoid and WHY.\r
- Good: "Create POST /login for {email,password}, bcrypt-validates User, returns 15-min JWT cookie via jose (not jsonwebtoken - Edge CJS issues)."\r
- Bad: "Add authentication", "Make login work"\r
- NEVER place fenced code blocks (```) inside `<action>`. Action is directive prose, not implementation code.\r
- Code excerpts belong in `<read_first>` source files or referenced context. Name identifiers, signatures, config keys, imports, env vars, and behavior; do not inline implementations.\r
\r
**<verify>:** How to prove the task is complete.\r
\r
```xml\r
<verify>\r
  <automated>pytest tests/test_module.py::test_behavior -x</automated>\r
</verify>\r
```\r
\r
- Good: Specific automated command that runs in < 60 seconds\r
- Bad: "It works", "Looks good", manual-only verification\r
- Simple format also accepted: `npm test` passes, `curl -X POST /api/auth/login` returns 200\r
\r
**Nyquist Rule:** Every `<verify>` includes `<automated>`. If no test exists, set `<automated>MISSING — Wave 0 must create {test_file} first</automated>` and create that scaffold.\r
\r
**Inherit the command that already worked (#2401):** reuse `prior_verify_commands` verbatim, prefer `npm --prefix <dir> run <script>`, ground every path you author. @gsd-core/references/planner-verify-command-grounding.md\r
\r
**Grep gate hygiene:** `grep -c` counts comments, so header prose can be self-invalidating. Use `grep -v '^#' | grep -c token`. Bare `== 0` gates on unfiltered files are forbidden.\r
\r
<comment_text_discipline>\r
**Comment-text discipline (HARD GATE, #429):** A literal an acceptance criterion negative-greps for must NOT appear verbatim in any `<action>` body. Full rules + `<!-- planner-discipline-allow: LIT -->` allowlist + worked examples: @gsd-core/references/planner-antipatterns.md ("Comment-Text Discipline").\r
</comment_text_discipline>\r
\r
<region_scoped_negative_gate>\r
**Region-scoped negative gates (WARN, #968)** and **Verify-gate hygiene (#1478/#1479):** @gsd-core/references/planner-antipatterns.md.\r
</region_scoped_negative_gate>\r
\r
**<done>:** Acceptance criteria - measurable state of completion.\r
- Good: "Valid credentials return 200 + JWT cookie, invalid credentials return 401"\r
- Bad: "Authentication is complete"\r
\r
**<precondition>** (optional, one prose line): a runnable/checkable fact the task assumes that plan ordering does not guarantee — external setup (`user_setup`), a prior-phase artifact, or an env var. The executor asserts it before running the task and halts on unmet. Emission rules + the contract triad (precondition ↔ `<verify>`/`<done>` ↔ `must_haves.truths`): @C:/Users/zakuv/Downloads/afaf-travel-planner/afaf-travel/.Codex/gsd-core/references/planner-preconditions.md.\r
\r
**<reversibility>** (optional): `rating="reversible|costly|one-way"` + one-line rationale for a decision this task implements. `one-way` inserts a `checkpoint:decision` before this task; `costly` is flagged only; unsure means `reversible`. Rules: @C:/Users/zakuv/Downloads/afaf-travel-planner/afaf-travel/.Codex/gsd-core/references/planner-reversibility.md\r
\r
See @C:/Users/zakuv/Downloads/afaf-travel-planner/afaf-travel/.Codex/gsd-core/references/planner-guidance.md for Task Types table, Task Sizing rules, Interface-First Task Ordering, and Specificity guidance.\r
