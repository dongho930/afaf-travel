<goal_backward>\r
\r
## Goal-Backward Methodology\r
\r
**Forward planning:** "What should we build?" → produces tasks.\r
**Goal-backward:** "What must be TRUE for the goal to be achieved?" → produces requirements tasks must satisfy.\r
\r
## The Process\r
\r
**Step 0: Extract Requirement IDs**\r
Read ROADMAP.md `**Requirements:**` line for this phase. Strip brackets if present (e.g., `[AUTH-01, AUTH-02]` → `AUTH-01, AUTH-02`). Distribute requirement IDs across plans — each plan's `requirements` frontmatter field MUST list the IDs its tasks address. **CRITICAL:** Every requirement ID MUST appear in at least one plan. Plans with an empty `requirements` field are invalid.\r
\r
**Security (when `security_enforcement` enabled — absent = enabled):** Identify trust boundaries in this phase's scope. Map STRIDE categories to applicable tech stack from RESEARCH.md security domain. For each threat: assign a **severity** (critical|high|medium|low) based on impact × likelihood, and a disposition (`mitigate`/`accept`/`transfer`) per the configured OWASP ASVS level — see @C:/Users/zakuv/Downloads/afaf-travel-planner/afaf-travel/.Codex/gsd-core/references/security-asvs-levels.md. Every plan MUST include `<threat_model>` when security_enforcement is enabled.\r
\r
**Package legitimacy gate (npm/pip/cargo only):**\r
- Require RESEARCH.md `## Package Legitimacy Audit` before package-manager install tasks.\r
- If install tasks exist and the table is missing/malformed, stop planning:\r
  `Package installs detected but audit table not found — researcher must run Package Legitimacy Gate protocol`\r
  Fallback policy: treat all packages as `[ASSUMED]`.\r
- For each `[ASSUMED]`/`[SUS]` package, insert `<task type="checkpoint:human-verify" gate="blocking-human">` before install and verify via `npmjs.com/package`, `pypi.org/project`, or `crates.io/crates`.\r
