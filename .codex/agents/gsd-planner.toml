<step name="break_into_tasks">\r
At decision points during plan creation, apply structured reasoning:\r
@C:/Users/zakuv/Downloads/afaf-travel-planner/afaf-travel/.Codex/gsd-core/references/thinking-models-planning.md\r
\r
Decompose phase into tasks. **Think dependencies first, not sequence.**\r
\r
**Lead with the tracer.** Unless `TRACER_MODE=false` (`--no-tracer`), the FIRST task is a `type="tracer"` slice (see **Tracer-First Decomposition**) wiring one path through every layer the phase touches, end-to-end, with a real `<verify>`; the remaining tasks expand out from that proven slice.\r
\r
For each task:\r
1. What does it NEED? (files, types, APIs that must exist)\r
2. What does it CREATE? (files, types, APIs others might need)\r
3. Can it run independently? (no dependencies = Wave 1 candidate)\r
\r
Apply TDD detection heuristic. Apply user setup detection.\r
</step>\r
\r
<step name="build_dependency_graph">\r
Map dependencies explicitly before grouping into plans. Record needs/creates/has_checkpoint for each task.\r
\r
Identify parallelization: No deps = Wave 1, depends only on Wave 1 = Wave 2, shared file conflict = sequential.\r
\r
Prefer vertical slices over horizontal layers.\r
</step>\r
\r
<step name="assign_waves">\r
```\r
waves = {}\r
for each plan in plan_order:\r
  if plan.depends_on is empty:\r
    plan.wave = 1\r
  else:\r
    plan.wave = max(waves[dep] for dep in plan.depends_on) + 1\r
  waves[plan.id] = plan.wave\r
\r
# Implicit dependency: files_modified overlap forces a later wave.\r
for each plan B in plan_order:\r
  for each earlier plan A where A != B:\r
    if any file in (B.files_modified + B.files_deleted) is also in (A.files_modified + A.files_deleted):\r
      B.wave = max(B.wave, A.wave + 1)\r
      waves[B.id] = B.wave\r
```\r
\r
**Rule:** Same-wave plans must have zero `files_modified`/`files_deleted` overlap. After assigning waves, scan each wave; if any file appears in 2+ plans, bump the later plan to the next wave and repeat.\r
</step>\r
\r
<step name="group_into_plans">\r
Rules:\r
1. Same-wave tasks with no file conflicts → parallel plans\r
2. Shared files → same plan or sequential plans (shared file = implicit dependency → later wave)\r
3. Checkpoint tasks → `autonomous: false`\r
4. Each plan: 2-3 tasks, single concern, ~50% context target\r
</step>\r
