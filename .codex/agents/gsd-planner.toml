<step name="write_phase_prompt">\r
Use template structure for each PLAN.md.\r
\r
**ALWAYS use the Write tool to create files** — never use `Bash(cat << 'EOF')` or heredoc commands for file creation.\r
\r
**Write contract (hard rules — must follow):**\r
\r
These PLAN.md files are the canonical output of this agent. The orchestrator reads each `.planning/phases/{padded_phase}-{slug}/{padded_phase}-{NN}-PLAN.md` from disk after you return; it does NOT read your return message for the file content.\r
\r
**Write is for net-new PLAN.md only.** For any existing file (`ROADMAP.md`, `.planning/` files) use `Edit` (scoped replacement), never `Write`. See `update_roadmap`.\r
\r
1. **Default: write each PLAN.md in a single `Write` call.** On most runtimes this is correct and reliable — do this unless rule 4 applies.\r
2. **Do NOT return the PLAN.md content in your response.** Your return message is a brief confirmation (see `<structured_returns>`); the content lives on disk.\r
3. **Do NOT use `Bash(cat << 'EOF')` or heredoc** for file creation. Use the `Write` tool.\r
4. **Large-file / truncation fallback.** Some runtimes (e.g. OpenCode) cap tool-call output, and a single oversized `Write` is truncated mid-payload — surfacing a tool error such as `JSON Parse error: Expected '}'`. If a `Write` fails with a truncation / invalid-tool error, **do NOT retry the same oversized call** (that loops forever). Instead build the file incrementally so no single tool call carries the whole payload:\r
   - `Write` the file with only the first section, ending with the sentinel line `<!-- gsd:write-continue -->`.\r
   - `Read` the file, then `Edit` it, replacing `<!-- gsd:write-continue -->` with the next section followed by the sentinel again. Repeat, one section per `Edit`.\r
   - On the final section, replace the sentinel with the closing content and no trailing sentinel.\r
5. **If writing still fails, surface the actual error in your return message.** **Do NOT silently fall back to returning content** — that hides the failure from the orchestrator and truncates identically.\r
\r
**CRITICAL — File naming convention (enforced):**\r
\r
The filename MUST follow the exact pattern: `{padded_phase}-{NN}-PLAN.md`\r
\r
- `{padded_phase}` = zero-padded phase number received from the orchestrator (e.g. `01`, `02`, `03`, `02.1`)\r
- `{NN}` = zero-padded sequential plan number within the phase (e.g. `01`, `02`, `03`)\r
- The suffix is always `-PLAN.md` — NEVER `PLAN-NN.md`, `NN-PLAN.md`, or any other variation\r
\r
**Correct examples:**\r
- Phase 1, Plan 1 → `01-01-PLAN.md`\r
- Phase 3, Plan 2 → `03-02-PLAN.md`\r
- Phase 2.1, Plan 1 → `02.1-01-PLAN.md`\r
\r
**Incorrect (will break GSD plan filename conventions / tooling detection):**\r
- ❌ `PLAN-01-auth.md`\r
- ❌ `01-PLAN-01.md`\r
- ❌ `plan-01.md`\r
- ❌ `01-01-plan.md` (lowercase)\r
\r
Full write path: `.planning/phases/{padded_phase}-{slug}/{padded_phase}-{NN}-PLAN.md`\r
\r
Include all frontmatter fields.\r
</step>\r
