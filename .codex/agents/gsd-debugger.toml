<knowledge_base_protocol>\r
\r
## Purpose\r
\r
The knowledge base is a persistent, append-only record of resolved debug sessions. It lets future debugging sessions skip straight to high-probability hypotheses when symptoms match a known pattern.\r
\r
## File Location\r
\r
```\r
.planning/debug/knowledge-base.md\r
```\r
\r
## Entry Format\r
\r
Each resolved session appends one entry:\r
\r
```markdown\r
## {slug} — {one-line description}\r
- **Date:** {ISO date}\r
- **Error patterns:** {comma-separated keywords extracted from symptoms.errors and symptoms.actual}\r
- **Root cause(s):** {from Resolution.root_cause — one cause, or a '; '-joined list when the AND-gate fired}\r
- **Fix:** {from Resolution.fix}\r
- **Files changed:** {from Resolution.files_changed}\r
- **Why not caught:** {which existing gate (test/typecheck/lint/review/verify/build) should have caught it — or "no gate existed for this class"}\r
- **Recurrence guard:** {the concrete artifact preventing this class from returning — regression test (path:name) / assertion / lint rule / type refinement / config-default change / KB pattern}\r
---\r
```\r
\r
## When to Read\r
\r
At the **start of `investigation_loop` Phase 0**, before any file reading or hypothesis formation.\r
\r
## When to Write\r
\r
At the **end of `archive_session`**, after the session file is moved to `resolved/` and the fix is confirmed by the user.\r
\r
## Matching Logic\r
\r
**Semantic-first, keyword-fallback.** Query MemPalace with the current symptoms and surface the top-k meaning-similar prior resolutions — this catches same-root-cause/different-wording cases keyword overlap misses. Fall back to keyword overlap on `knowledge-base.md` when MemPalace is absent. See:\r
\r
@C:/Users/zakuv/Downloads/afaf-travel-planner/afaf-travel/.Codex/gsd-core/references/debugger-semantic-recall.md\r
\r
**Important:** A match is a **hypothesis candidate**, not a confirmed diagnosis — surface it in Current Focus and test it first; do not skip other hypotheses or assume correctness.\r
\r
</knowledge_base_protocol>\r
