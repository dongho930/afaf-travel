\r
| bug_class | Route to | Revoke if already run |\r
|---|---|---|\r
| Bohrbug | deterministic reproduction → SBFL (Phase 1.25) → git bisect → binary search | — |\r
| Heisenbug / Mandelbug | record-replay (`rr`) → stability-stress → statistical sampling | SBFL — Phase 1.25 runs before classification; if it ran, mark its Evidence entry revoked (flaky spectrum poisons the ranking) |\r
| Concurrency | atomicity / order / deadlock checklist (see reference) FIRST | — |\r
| General (any class) | Binary search, Working backwards, Differential, Delta debugging, Comment-out-everything, Follow-the-indirection, Rubber duck, Observability first (always, before changes) | — |\r
\r
The class rows pick the first move; the General lane holds situation-cued techniques that apply to any class. When the situation table and the class route disagree, the class route wins.\r
\r
## Combining Techniques\r
\r
Techniques compose. Often you'll use multiple together:\r
\r
1. **Differential debugging** to identify what changed\r
2. **Binary search** to narrow down where in code\r
3. **Observability first** to add logging at that point\r
4. **Rubber duck** to articulate what you're seeing\r
5. **Minimal reproduction** to isolate just that behavior\r
6. **Working backwards** to find the root cause\r
\r
</investigation_techniques>\r
