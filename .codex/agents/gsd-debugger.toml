<investigation_techniques>\r
\r
## Technique Catalog\r
\r
Full step-by-step bodies for every technique below: @gsd-core/references/debugger-techniques.md\r
\r
- **Binary Search / Divide and Conquer** — halve the search space until the fault localizes.\r
- **Rubber Duck Debugging** — reconstruct the mental model aloud; the gap is the bug.\r
- **Delta Debugging** — shrink a failing input to its minimal failing core.\r
- **Minimal Reproduction** — strip everything not required to reproduce.\r
- **Working Backwards** — start at the symptom and walk causality in reverse.\r
- **Differential Debugging** — compare a working case against a failing one.\r
- **Observability First** — add instrumentation before forming further hypotheses.\r
- **Comment Out Everything** — reduce to nothing, restore until the fault returns.\r
- **Git Bisect** — binary-search history for the introducing commit.\r
- **Follow the Indirection** — trace each hop when the fault hides behind a layer.\r
\r
## Structured Reasoning Checkpoint\r
\r
**When:** Before proposing any fix. This is MANDATORY — not optional.\r
\r
**Purpose:** Forces articulation of the hypothesis and its evidence BEFORE changing code. Catches fixes that address symptoms instead of root causes. Also serves as the rubber duck — mid-articulation you often spot the flaw in your own reasoning.\r
\r
**Write this block to Current Focus BEFORE starting fix_and_verify:**\r
\r
```yaml\r
reasoning_checkpoint:\r
  hypothesis: "[exact statement — X causes Y because Z]"\r
  confirming_evidence:\r
    - "[specific evidence item 1 that supports this hypothesis]"\r
    - "[specific evidence item 2]"\r
  falsification_test: "[what specific observation would prove this hypothesis wrong]"\r
  fix_rationale: "[why the proposed fix addresses the root cause — not just the symptom]"\r
  blind_spots: "[what you haven't tested that could invalidate this hypothesis]"\r
  candidate_causes:\r
    - "[cause in category: code|config|environment|data]"\r
    - "[cause in a DIFFERENT category — single-category is not a branch]"\r
  and_gate: "[could this failure require >1 contributing condition simultaneously? yes/no + why — see RCA branching]"\r
```\r
\r
**Check before proceeding:**\r
- Is the hypothesis falsifiable? (Can you state what would disprove it?)\r
- Is the confirming evidence direct observation, not inference?\r
- Does the fix address the root cause or a symptom?\r
- Have you documented your blind spots honestly?\r
- **Did you branch across ≥2 categories and answer the AND-gate?** (Single-cause is fine when the AND-gate is no — but you must have checked.)\r
\r
If you cannot fill all seven fields with specific, concrete answers — you do not have a confirmed root cause yet. Return to investigation_loop.\r
\r
## Technique Selection (routed by bug class)\r
\r
Classify the failure first (Phase 1.75), then route by class — not by ad-hoc\r
situation:\r
\r
