**Claim provenance:** Every factual claim in RESEARCH.md must be tagged with its source:\r
- `[VERIFIED: npm registry]` — confirmed via tool (npm view, web search, codebase grep) AND discovered from an authoritative source (official docs, Context7)\r
- `[CITED: docs.example.com/page]` — referenced from official documentation\r
- `[ASSUMED]` — based on training knowledge, not verified in this session\r
\r
**Package name provenance rule:** A package name discovered via WebSearch, training data, or any non-authoritative source must be tagged `[ASSUMED]` regardless of whether `npm view` confirms it exists on the registry. Registry existence alone does not confer `[VERIFIED]` status — a slopsquatted package also passes `npm view`. Only packages confirmed via official documentation or Context7 AND returning `OK` from `gsd-tools query package-legitimacy check` may be tagged `[VERIFIED: npm registry]`.\r
\r
**In-repo value provenance rule:** A claim about an in-repo *discrete value* — an enum, a schema or type union, an error code, a status constant, or a filesystem path — may be tagged `[VERIFIED: …]` only if you opened the source-of-truth file with `Read` **this session**. A codebase `grep` is not sufficient on its own: it confirms a string occurs, not that you read the definition. Cite the path **and line range** (`[VERIFIED: src/types/order.ts:14-22]`), and quote the values **verbatim** in RESEARCH.md beside the claim — paraphrase is forbidden. The quote is what makes the tag checkable — a citation with no quote beside it does not earn `[VERIFIED]`, however precise the line range looks. Every value appearing in a code example or skeleton must also appear in that verbatim quote; a value that does not is `[ASSUMED]`. For a filesystem path, cite the line in the script that creates it, not the location you expect it to occupy. Training memory and a web search are not substitutes for reading the file — a discrete value that merely looks right fails at the executor's `parse()`/typecheck, the most expensive place to discover it.\r
\r
**Absent-evidence provenance rule:** A compatibility claim resting on **missing** metadata — no `python_requires`, no `engines` field, no per-version classifier, no changelog entry, no matching row in a support matrix — does not earn `[VERIFIED: …]`, however authoritative the source you consulted. Absence is silence about **every** value, not a constraint on one: a project declaring no supported versions says nothing about the version you want *and* nothing about the version you are standardizing on, so the same evidence "proves" both. The rule keys on the **evidence, not the wording** — "does not support 3.14" rephrased as "supports only up to 3.13" rests on the identical absence and earns the identical tag, and an absence is equally not evidence that the target *is* supported. A **present** constraint is the opposite case and is untouched: `requires-python = ">=3.9,<3.12"` is a declared exclusion and earns `[VERIFIED: …]`, as does documentation stating the incompatibility affirmatively (`[CITED: …]`). What separates the two is whether the declaration bounds **every** value or only the ones it names: an explicit range or upper bound (`requires-python`, `engines`) speaks about all versions, so it is a present constraint, while an enumerated allow-list that stops short of your target (classifiers running `:: 3.9` through `:: 3.13` with no `:: 3.14`) speaks only about the versions it lists and stays silent on yours, so it is still a governed absence unless the project states the list is exhaustive. Reframing that silence as a positive finding — "the classifiers affirmatively declare support through 3.13" — is the same absence in different clothes and earns the same tag. The only route from an absence to `[VERIFIED]` is a **positive falsification attempt**: run it against the real target and **paste the failing output** — asserting that you ran it does not earn the tag, and a failure attributable to something else (a missing certificate, a wrong host) is not a falsification. A probe that *succeeds* refutes the claim: drop it rather than downgrade it. When the lookup itself failed, report *no observation*, never a declared absence. Everything short of this is `[ASSUMED]`, which is always available — a probe you cannot run in this environment costs a confirmation checkpoint, not a blocked plan.\r
\r
Claims tagged `[ASSUMED]` signal to the planner and discuss-phase that the information needs user confirmation before becoming a locked decision. Never present assumed knowledge as verified fact — especially for compliance requirements, retention policies, security standards, or performance targets where multiple valid approaches exist.\r
