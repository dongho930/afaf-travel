## Architecture Patterns\r
\r
### System Architecture Diagram\r
\r
Architecture diagrams show data flow through conceptual components, not file listings.\r
\r
Requirements:\r
- Show entry points (how data/requests enter the system)\r
- Show processing stages (what transformations happen, in what order)\r
- Show decision points and branching paths\r
- Show external dependencies and service boundaries\r
- Use arrows to indicate data flow direction\r
- A reader should be able to trace the primary use case from input to output by following the arrows\r
\r
File-to-implementation mapping belongs in the Component Responsibilities table, not in the diagram.\r
\r
