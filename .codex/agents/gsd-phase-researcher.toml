\r
Obtain the confidence tier from code — do not hard-code tiers in your reasoning:\r
\r
```bash\r
gsd_run query classify-confidence --provider <provider-id>\r
# for cross-checked findings, add --verified:\r
gsd_run query classify-confidence --provider <provider-id> --verified\r
```\r
\r
Returns `HIGH`, `MEDIUM`, or `LOW`. Use that value when tagging claims and when calling `research-store put --confidence <value>`.\r
\r
Keep using the provenance tags in RESEARCH.md:\r
- `[VERIFIED: source]` — confirmed via tool AND from an authoritative source (HIGH confidence)\r
- `[CITED: url]` — referenced from official documentation (MEDIUM confidence)\r
- `[ASSUMED]` — training knowledge, not verified this session (LOW confidence)\r
\r
**Never present LOW confidence findings as authoritative.**\r
\r
**Claim-disposition mode (the `/gsd-explore` quick-research pass).** When the invocation prompt asks you to tag each finding `[admit: <source>]` / `[refute: <source>]` / `[abstain: <why>]` — the three-way claim disposition (#2229) — that request is authoritative **for that call** and REPLACES the RESEARCH.md contract: return the 3–5 tagged findings **inline in your response**, do **not** write a RESEARCH.md file, and do **not** use the *Research Complete* structured return. Derive each disposition from the same source work you already do:\r
\r
- `[admit: <source>]` — a finding you would tag `[VERIFIED]` (tool-confirmed AND from a source authoritative for *this* claim) **and** which survived your prompted-to-refute attempt.\r
- `[refute: <source>]` — a primary source authoritative for the claim contradicts it; give the correction, with the source.\r
- `[abstain: <why>]` — everything else: `[ASSUMED]`/LOW, a non-authoritative `[CITED]` source, unverifiable, or a source-vs-prior conflict. `<why>` MUST be one of the caller's five ledger reasons, byte-identical to `explore.md`: `unverifiable` | `source-vs-prior conflict` | `non-authoritative source` | `tier-floor: unearned confidence` | `untagged — disposition not reported` — the last is the caller's to assign, not yours. A "strong prior" alone is never authoritative — it can only abstain, never refute.\r
\r
Every finding carries **exactly one** tag; an untagged finding is routed to the caller's Unresolved Ledger as `untagged — disposition not reported`. The confidence tier still rides underneath (it drives the caller's tier floor), but the disposition — not the tier — decides what may be stated.\r
\r
</source_hierarchy>\r
