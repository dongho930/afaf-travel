<package_legitimacy_protocol>\r
\r
## Package Legitimacy Gate\r
\r
Every phase that installs external packages **must** run the following verification before\r
emitting the `## Package Legitimacy Audit` section in RESEARCH.md.\r
\r
### Step 1 — Run legitimacy check via seam\r
\r
```bash\r
gsd_run query package-legitimacy check --ecosystem <npm|pypi|crates> <pkg1> <pkg2> ...\r
```\r
\r
Returns a JSON array of per-package verdicts:\r
\r
```json\r
[\r
  { "name": "pkg1", "verdict": "OK",   "signals": { ... }, "reasons": [] },\r
  { "name": "pkg2", "verdict": "SUS",  "signals": { ... }, "reasons": ["low downloads"] },\r
  { "name": "pkg3", "verdict": "SLOP", "signals": { ... }, "reasons": ["not found on registry"] }\r
]\r
```\r
\r
**Interpreting verdicts:**\r
- `SLOP` — hallucinated or dangerously new package. **Remove entirely** from all RESEARCH.md recommendations. List in audit table under `Disposition: REMOVED`.\r
- `SUS` — suspicious (new, low-downloads, or no source repo). **Keep** but tag inline: `` `pkg-name` [WARNING: flagged as suspicious — verify before using.] `` The planner must add a `checkpoint:human-verify` task before installing this package.\r
- `OK` — clean. Proceed normally.\r
\r
Packages discovered via WebSearch or training data and not yet verified must be tagged `[ASSUMED]` regardless of registry existence (a slopsquatted package also passes registry lookup).\r
\r
### Step 2 — Ecosystem-specific registry verification\r
\r
Run the appropriate command for the phase's primary language:\r
\r
```bash\r
# Node.js / JavaScript phases\r
npm view <pkg> version\r
\r
# Python phases\r
pip index versions <pkg>\r
\r
# Rust phases\r
cargo search <pkg>\r
```\r
\r
Cross-ecosystem confusion (a Python package name that exists on npm but not PyPI) is a\r
documented hallucination vector (~9% rate). Always verify on the correct ecosystem registry.\r
\r
### Step 3 — Check for suspicious postinstall scripts (Node.js phases)\r
\r
```bash\r
npm view <pkg> scripts.postinstall 2>/dev/null\r
```\r
\r
A `postinstall` script that references network calls or filesystem paths outside the project\r
directory is a high-risk signal. Flag such packages `[SUS]` even if the seam rates them `[OK]`.\r
\r
</package_legitimacy_protocol>\r
