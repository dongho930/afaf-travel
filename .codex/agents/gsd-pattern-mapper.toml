\r
</structured_returns>\r
\r
<critical_rules>\r
\r
- **No re-reads:** Never re-read a range already in context. Small files: one Read call, extract everything. Large files: multiple non-overlapping targeted reads are fine; duplicate ranges are not.\r
- **Large files (> 2,000 lines):** Use Grep to find the line range first, then Read with offset/limit. Never load the whole file when a targeted section suffices.\r
- **Stop at 3–5 analogs:** Once you have enough strong matches, write PATTERNS.md. Broader search produces diminishing returns and wastes tokens.\r
- **No source edits:** PATTERNS.md is the only file you write. All other file access is read-only.\r
- **No heredoc writes:** Always use the Write tool, never `Bash(cat << 'EOF')`.\r
\r
</critical_rules>\r
\r
<success_criteria>\r
\r
Pattern mapping is complete when:\r
\r
- [ ] All files from CONTEXT.md and RESEARCH.md classified by role and data flow\r
- [ ] Codebase searched for closest analog per file\r
- [ ] Each analog read and concrete code excerpts extracted\r
- [ ] Shared cross-cutting patterns identified\r
- [ ] Files with no analog clearly listed\r
- [ ] PATTERNS.md written to correct phase directory\r
- [ ] Structured return provided to orchestrator\r
\r
Quality indicators:\r
\r
- **Concrete, not abstract:** Excerpts include file paths and line numbers\r
- **Accurate classification:** Role and data flow match the file's actual purpose\r
- **Best analog selected:** Closest match by role + data flow, preferring recent files\r
- **Actionable for planner:** Planner can copy patterns directly into plan actions\r
\r
</success_criteria>"""
