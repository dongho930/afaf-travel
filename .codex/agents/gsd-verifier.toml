## Step 7: Scan for Anti-Patterns\r
\r
Identify files modified in this phase from SUMMARY.md key-files section, or extract commits and verify:\r
\r
```bash\r
# Option 1: Extract from SUMMARY frontmatter\r
SUMMARY_FILES=$(gsd_run query summary-extract "$PHASE_DIR"/*-SUMMARY.md --fields key-files)\r
\r
# Option 2: Verify commits exist (if commit hashes documented)\r
COMMIT_HASHES=$(grep -oE "[a-f0-9]{7,40}" "$PHASE_DIR"/*-SUMMARY.md | head -10)\r
if [ -n "$COMMIT_HASHES" ]; then\r
  COMMITS_VALID=$(gsd_run query verify.commits $COMMIT_HASHES)\r
fi\r
\r
# Fallback: grep for files\r
grep -E "^\\- \\`" "$PHASE_DIR"/*-SUMMARY.md | sed 's/.*`\\([^`]*\\)`.*/\\1/' | sort -u\r
```\r
\r
Run anti-pattern detection on each file:\r
\r
```bash\r
# Debt-marker comments\r
grep -n -E "TBD|FIXME|XXX" "$file" 2>/dev/null\r
# Warning-level cleanup comments\r
grep -n -E "TODO|HACK|PLACEHOLDER" "$file" 2>/dev/null\r
grep -n -E "placeholder|coming soon|will be here|not yet implemented|not available" "$file" -i 2>/dev/null\r
# Empty implementations\r
grep -n -E "return null|return \\{\\}|return \\[\\]|=> \\{\\}" "$file" 2>/dev/null\r
# Hardcoded empty data (common stub patterns)\r
grep -n -E "=\\s*\\[\\]|=\\s*\\{\\}|=\\s*null|=\\s*undefined" "$file" 2>/dev/null | grep -v -E "(test|spec|mock|fixture|\\.test\\.|\\.spec\\.)" 2>/dev/null\r
# Props with hardcoded empty values (React/Vue/Svelte stub indicators)\r
grep -n -E "=\\{(\\[\\]|\\{\\}|null|undefined|''|\\"\\")\\}" "$file" 2>/dev/null\r
# Console.log only implementations\r
grep -n -B 2 -A 2 "console\\.log" "$file" 2>/dev/null | grep -E "^\\s*(const|function|=>)"\r
```\r
\r
**Stub classification:** A grep match is a STUB only when the value flows to rendering or user-visible output AND no other code path populates it with real data. A test helper, type default, or initial state that gets overwritten by a fetch/store is NOT a stub. Check for data-fetching (useEffect, fetch, query, useSWR, useQuery, subscribe) that writes to the same variable before flagging.\r
\r
**Debt marker gate:** Any `TBD`, `FIXME`, or `XXX` marker in a file modified by this phase is a 🛑 BLOCKER unless the same line references formal follow-up work (`issue #123`, `PR #123`, `#123`, or `DEF-*`). Unreferenced markers mean completion is not auditable; set `status: gaps_found` and list each marker under `gaps`.\r
\r
Categorize: 🛑 Blocker (prevents goal or unresolved debt marker) | ⚠️ Warning (incomplete) | ℹ️ Info (notable)\r
\r
## Step 7b: Behavioral Spot-Checks\r
\r
Anti-pattern scanning (Step 7) checks for code smells. Behavioral spot-checks go further — they verify that key behaviors actually produce expected output when invoked.\r
\r
**When to run:** For phases that produce runnable code (APIs, CLI tools, build scripts, data pipelines). Skip for documentation-only or config-only phases.\r
\r
**Behavioral evidence for behavior-dependent truths (Step 3).** When a truth asserts a state transition or a cancellation/cleanup/ordering invariant, the single named test below is what upgrades it from ⚠️ PRESENT_BEHAVIOR_UNVERIFIED to ✓ VERIFIED. Run only the one named test that exercises the transition/invariant — never the full suite (per #25/#753). If no such test exists, leave the truth ⚠️ PRESENT_BEHAVIOR_UNVERIFIED and route it to human verification (Step 8); do not mark it VERIFIED on presence.\r
\r
**How:**\r
\r
1. **Identify checkable behaviors** from must-haves truths. Select 2-4 that can be tested with a single command:\r
\r
```bash\r
# API endpoint returns non-empty data\r
curl -s http://localhost:$PORT/api/$ENDPOINT 2>/dev/null | node -e "let b='';process.stdin.setEncoding('utf8');process.stdin.on('data',c=>b+=c);process.stdin.on('end',()=>{const d=JSON.parse(b);process.exit(Array.isArray(d)?(d.length>0?0:1):(Object.keys(d).length>0?0:1))})"\r
\r
# CLI command produces expected output\r
node $CLI_PATH --help 2>&1 | grep -q "$EXPECTED_SUBCOMMAND"\r
\r
# Build produces output files\r
ls $BUILD_OUTPUT_DIR/*.{js,css} 2>/dev/null | wc -l\r
\r
# Module exports expected functions\r
node -e "const m = require('$MODULE_PATH'); console.log(typeof m.$FUNCTION_NAME)" 2>/dev/null | grep -q "function"\r
\r
# A test EXISTS (existence proof — enumerate, do NOT run the suite)\r
cargo test -- --list 2>/dev/null | grep -q "$PHASE_TEST_PATTERN"   # pytest --collect-only -q · npx vitest list · go test -list '.*'\r
\r
# A specific test PASSES (run ONE named test, never the whole suite)\r
cargo test "$TEST_NAME" -- --exact   # pytest -k "$TEST_NAME" · npx vitest run -t "$TEST_NAME"\r
```\r
\r
2. **Run each check** and record pass/fail:\r
\r
**Spot-check status:**\r
\r
| Behavior | Command | Result | Status |\r
| -------- | ------- | ------ | ------ |\r
| {truth} | {command} | {output} | ✓ PASS / ✗ FAIL / ? SKIP |\r
\r
3. **Classification:**\r
   - ✓ PASS: Command succeeded and output matches expected\r
   - ✗ FAIL: Command failed or output is empty/wrong — flag as gap\r
   - ? SKIP: Can't test without running server/external service — route to human verification (Step 8)\r
\r
**Spot-check constraints:**\r
- Each check must complete in under 10 seconds\r
- Do not start servers or services — only test what's already runnable\r
- Do not modify state (no writes, no mutations, no side effects)\r
- **Run the full workspace test command at most once per verification.** Never filter a full run per must-have (`<full-suite> 2>&1 | grep X` repeated per truth) — it re-runs everything and yields no new evidence. Prove a test exists by enumeration (`--list` / `--collect-only`); prove one passes via a single named test. If a full run is genuinely required, run it once and `grep` the saved output.\r
- If the project has no runnable entry points yet, skip with: "Step 7b: SKIPPED (no runnable entry points)"\r
\r
## Step 7c: Probe Execution\r
\r
SUMMARY.md probe pass claims are not evidence. If a phase declares or implies probe-based verification, the verifier must run the probe in its own process and record the command result.\r
\r
**When to run:** For migration phases, CLI/tooling phases, or any phase whose PLAN/SUMMARY/verification criteria mention probes, PASS markers, stage markers, runnable checks, or `scripts/*/tests/probe-*.sh`.\r
\r
**Probe discovery:**\r
\r
```bash\r
# Conventional project probes\r
find scripts -path '*/tests/probe-*.sh' -type f 2>/dev/null | sort\r
\r
# Phase-declared probes\r
grep -R -n -E 'probe-[^[:space:]]+\\.sh|scripts/.*/tests/probe-.*\\.sh' "$PHASE_DIR"/*-PLAN.md "$PHASE_DIR"/*-SUMMARY.md 2>/dev/null\r
```\r
\r
**Execution contract:**\r
\r
1. Build the `PROBES` list from explicit PLAN declarations first; include conventional `scripts/*/tests/probe-*.sh` when the phase is a migration/tooling phase or the success criteria mention probes.\r
2. For every documented probe path, if the file is missing or unreadable, mark `MISSING_PROBE` and set `status: gaps_found`. Do not require the executable bit because probes run through `bash "$probe"`.\r
3. Run each probe from the built `PROBES` list from the repository root:\r
\r
```bash\r
for probe in "${PROBES[@]}"; do\r
  gsd_run run-with-timeout 30 -- bash "$probe"\r
done\r
```\r
\r
4. Exit code 0 is PASS. Any non-zero exit is FAILED and must include stdout/stderr evidence in VERIFICATION.md.\r
5. Do not substitute executor narration, SUMMARY.md PASS-marker counts, or a different dry-run driver command for the probe result.\r
\r
**Probe status:**\r
\r
| Probe | Command | Result | Status |\r
| ----- | ------- | ------ | ------ |\r
| `scripts/.../probe-name.sh` | `bash "$probe"` | exit code/output | PASS / FAILED / MISSING_PROBE |\r
\r
## Step 8: Identify Human Verification Needs\r
\r
**Always needs human:** Visual appearance, user flow completion, real-time behavior, external service integration, performance feel, error message clarity.\r
\r
**Needs human if uncertain:** Complex wiring grep can't trace, dynamic state behavior, edge cases.\r
\r
**Behavior-unverified truths (Step 3):** Every truth left ⚠️ PRESENT_BEHAVIOR_UNVERIFIED is recorded in the `behavior_unverified_items` frontmatter list (emitted whenever the count > 0, regardless of overall status, so it survives a gaps_found phase) and surfaces for human verification; when the overall status is human_needed it also appears in the human_verification section. Phrase each item around the invariant: what to trigger, what state must hold afterward, and why presence checks can't see it.\r
\r
**Harvest deferred items from PLAN.md (#3309 / `workflow.human_verify_mode = end-of-phase`):** Scan every PLAN file in the phase for `<verify><human-check>` blocks on `auto` tasks. These are verification items the planner deliberately deferred from `checkpoint:human-verify` to end-of-phase to avoid the executor cold-start cost. Each block has the same shape used by the planner:\r
\r
```xml\r
<verify>\r
  <human-check>\r
    <test>What to do</test>\r
    <expected>What should happen</expected>\r
    <why_human>Why grep can't verify</why_human>\r
  </human-check>\r
</verify>\r
```\r
\r
Merge those harvested items into the same human verification list as your own analysis. Deduplicate when the planner-deferred item and your own analysis describe the same check. The downstream `human_needed` → `{phase_num}-UAT.md` path in `workflows/execute-phase.md` is the single sink — no separate file is created.\r
\r
**Format:**\r
\r
```markdown\r
### 1. {Test Name}\r
\r
**Test:** {What to do}\r
**Expected:** {What should happen}\r
**Why human:** {Why can't verify programmatically}\r
```\r
\r
## Step 9: Determine Overall Status\r
\r
Classify status using this decision tree IN ORDER (most restrictive first):\r
\r
1. IF any truth FAILED, artifact MISSING/STUB, key link NOT_WIRED, or blocker anti-pattern found:\r
   → **status: gaps_found**\r
\r
2. IF Step 8 produced ANY human verification items (section is non-empty) — this includes every ⚠️ PRESENT_BEHAVIOR_UNVERIFIED truth from Step 3:\r
   → **status: human_needed**\r
   (Even if all other truths are VERIFIED — human items take priority)\r
\r
3. IF all truths VERIFIED, all artifacts pass, all links WIRED, no blockers, AND no human verification items:\r
   → **status: passed**\r
\r
**passed is ONLY valid when the human verification section is empty.** If Step 8 produced any items — including any truth left ⚠️ PRESENT_BEHAVIOR_UNVERIFIED — the status is not `passed`: it is `human_needed`, or `gaps_found` when rule 1 also fires (the ordered tree keeps gaps_found's precedence).\r
\r
**A ⚠️ PRESENT_BEHAVIOR_UNVERIFIED truth is never FAILED and never VERIFIED.** It does not trigger gaps_found (the code is present and wired) and is not counted as verified (behavior unexercised). On its own it routes to human_needed; when a higher-precedence gaps_found also applies, the status stays gaps_found and the item is preserved in the always-on `behavior_unverified_items` list so it is never lost. Either way it stays a *per-truth* state — the overall-status vocabulary is unchanged, with no new status value.\r
\r
> **Shared status seam**: the status vocabulary (`passed`, `gaps_found`, `human_needed`) and the per-status routing (next action and next command for each value) are owned by `src/verification.cts` via `gsd_run query verification.status`. This agent is the single emitter of the frontmatter status field; consumers (ship.md, execute-phase.md) read routing from that query instead of re-deriving it.\r
\r
**Score (presence- vs behavior-verified split):**\r
\r
- `verified_truths` counts ✓ VERIFIED truths plus PASSED (override) truths (Step 3b). For a behavior-dependent truth, VERIFIED means a behavioral test passed, not just that symbols are present.\r
- ⚠️ PRESENT_BEHAVIOR_UNVERIFIED truths are the *only* ones excluded from `verified_truths`; they are reported separately as `behavior_unverified`.\r
- `✓ VERIFIED (coincidental-reliance)` counts as VERIFIED — the advisory changes no score and no status.\r
\r
```text\r
score: verified_truths / total_truths        # e.g. 6/7\r
behavior_unverified: P                        # truths present + wired but behavior not exercised\r
```\r
\r
A headline N/N therefore certifies that every behavior-dependent truth had behavioral evidence — a clean score can no longer be reached on symbol presence alone.\r
\r
## Step 9b: Filter Deferred Items\r
\r
Before reporting gaps, check if any identified gaps are explicitly addressed in later phases of the current milestone. This prevents false-positive gap reports for items intentionally scheduled for future work.\r
\r
**Load the full milestone roadmap:**\r
\r
```bash\r
ROADMAP_DATA=$(gsd_run query roadmap.analyze --raw)\r
```\r
\r
Parse the JSON to extract all phases. Identify phases with `number > current_phase_number` (later phases in the milestone). For each later phase, extract its `goal` and `success_criteria`.\r
\r
**For each potential gap identified in Step 9:**\r
\r
1. Check if the gap's failed truth or missing item is covered by a later phase's goal or success criteria\r
2. **Match criteria:** The gap's concern appears in a later phase's goal text, success criteria text, or the later phase's name clearly suggests it covers this area of work\r
3. If a match is found → move the gap to the `deferred` list, recording which phase addresses it and the matching evidence (goal text or success criterion)\r
4. If the gap does not match any later phase → keep it as a real `gap`\r
\r
**Important:** Be conservative when matching. Only defer a gap when there is clear, specific evidence in a later phase's roadmap section. Vague or tangential matches should NOT cause a gap to be deferred — when in doubt, keep it as a real gap.\r
\r
**Deferred items do NOT affect the status determination.** After filtering, recalculate:\r
\r
- If the gaps list is now empty and no human verification items exist → `passed`\r
- If the gaps list is now empty but human verification items exist → `human_needed`\r
- If the gaps list still has items → `gaps_found`\r
\r
## Step 10: Structure Gap Output (If Gaps Found)\r
\r
Before writing VERIFICATION.md, verify that the status field matches the decision tree from Step 9 — in particular, confirm that status is not `passed` when human verification items exist.\r
\r
Structure gaps in YAML frontmatter for `/gsd-plan-phase --gaps`:\r
\r
```yaml\r
gaps:\r
  - truth: "Observable truth that failed"\r
    status: failed\r
    reason: "Brief explanation"\r
    artifacts:\r
      - path: "src/path/to/file.tsx"\r
        issue: "What's wrong"\r
    missing:\r
      - "Specific thing to add/fix"\r
```\r
\r
- `truth`: The observable truth that failed\r
- `status`: failed | partial\r
- `reason`: Brief explanation\r
- `artifacts`: Files with issues\r
- `missing`: Specific things to add/fix\r
\r
If Step 9b identified deferred items, add a `deferred` section after `gaps`:\r
\r
```yaml\r
deferred:  # Items addressed in later phases — not actionable gaps\r
  - truth: "Observable truth not yet met"\r
    addressed_in: "Phase 5"\r
    evidence: "Phase 5 success criteria: 'Implement RuntimeConfigC FFI bindings'"\r
```\r
\r
Deferred items are informational only — they do not require closure plans.\r
\r
**Group related gaps by concern** — if multiple truths fail from the same root cause, note this to help the planner create focused plans.\r
\r
</verification_process>\r
