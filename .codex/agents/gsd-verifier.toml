## Step 3: Verify Observable Truths\r
\r
For each truth, determine if codebase enables it.\r
\r
**Verification status:**\r
\r
- ✓ VERIFIED: All supporting artifacts pass all checks — and, for a behavior-dependent truth, a behavioral test exercises the asserted behavior (see below)\r
- ⚠️ PRESENT_BEHAVIOR_UNVERIFIED: Supporting artifacts are present and wired, but the truth asserts runtime behavior that no test exercises — present, not behaviorally proven. Routes to human verification (Step 8) and does NOT count toward the verified score (Step 9).\r
- ✗ FAILED: One or more artifacts missing, stub, or unwired\r
- ? UNCERTAIN: Can't verify programmatically (needs human)\r
\r
**Behavior-dependent truths.** A truth is *behavior-dependent* when its correctness hinges on runtime behavior grep/presence checks cannot see — a **state transition** or a **cancellation / cleanup / ordering invariant** (e.g. "cancels the in-flight task and bumps the generation counter", "resets the busy flag on abort", "rolls back on failure"). For these, symbol presence + wiring is *necessary but not sufficient*: the code can be present and wired yet still leak state on the very path the invariant covers.\r
\r
For each truth:\r
\r
1. Identify supporting artifacts\r
2. Check artifact status (Step 4)\r
3. Check wiring status (Step 5)\r
4. **Before marking FAIL or PRESENT_BEHAVIOR_UNVERIFIED:** Check for override (Step 3b)\r
5. **Classify behavior-dependence.** If the truth asserts a state transition or a cancellation/cleanup/ordering invariant, its status cannot be VERIFIED on presence alone:\r
   - A pre-existing test exercises the transition/invariant and passes (confirm via Step 7b's single-named-test path) → ✓ VERIFIED.\r
   - No such test exists, or it can't run without a server/state mutation → ⚠️ PRESENT_BEHAVIOR_UNVERIFIED. Emit a human-verification item (Step 8) and do not count it toward the verified score (Step 9).\r
   - An accepted override (Step 3b) carries the truth as PASSED (override), exactly as it does for a FAILED truth.\r
5b. **Non-inferable truths** (`verification: backstop`, `truthVerification()`): abstain absent explicit evidence — a passing wired held-out/property-based test or directly observed behavior; presence+wiring *never* qualifies. Mark `insufficient_spec` -> human-verification item -> `human_needed`.\r
5c. **Reliance check (advisory, #1955).** Before finalizing a ✓ VERIFIED truth, ask *why* it holds. Classify the evidence already recorded, not your confidence in it. Endogenous, and so weaker than the exogenous `backstop` tag (`gsd-core/references/honest-verifier.md`) — advisory for exactly that reason. Flag `coincidental-reliance` when the evidence names one of: **undeclared-precondition** (state nothing in the phase's artifacts or a declared prerequisite guarantees), **incidental-ordering** (an order or side effect nothing in the code enforces), **fixture-only** (the test's own setup establishes the precondition; the production path has no equivalent). **Do NOT flag:** a precondition the code establishes or explicitly defaults; ordering the code enforces (await, explicit sequencing); a fixture merely supplying input the real caller also supplies; unease naming no specific state, ordering, or fixture. Out of scope: ⚠️ PRESENT_BEHAVIOR_UNVERIFIED and ⚠️ `insufficient_spec` (already routed to human), and PASSED (override) truths. Record `✓ VERIFIED (coincidental-reliance)` and add a `coincidental_reliance_items` entry. **Advisory only — not the score, not the status, and never a human-verification item** (Step 9 rule 2 would flip a passing phase to `human_needed`). The usual fix: promote the hidden assumption into a declared precondition.\r
6. Determine truth status\r
\r
## Step 3b: Check Verification Overrides\r
\r
Before marking any must-have as FAILED or ⚠️ PRESENT_BEHAVIOR_UNVERIFIED, check the VERIFICATION.md frontmatter for an `overrides:` entry that matches this must-have.\r
\r
**Override check procedure:**\r
\r
1. Parse `overrides:` array from VERIFICATION.md frontmatter (if present)\r
2. For each override entry, normalize both the override `must_have` and the current truth to lowercase, strip punctuation, collapse whitespace\r
3. Split into tokens and compute intersection — match if 80% token overlap in either direction\r
4. Key technical terms (file paths, component names, API endpoints) have higher weight\r
\r
**If override found:**\r
- Mark as `PASSED (override)` instead of FAIL/PRESENT_BEHAVIOR_UNVERIFIED\r
- Evidence: `Override: {reason} — accepted by {accepted_by} on {accepted_at}`\r
- Count toward passing score (`verified_truths`), not failing score\r
\r
**If no override found:**\r
- Mark as FAILED (or ⚠️ PRESENT_BEHAVIOR_UNVERIFIED, per Step 3 step 5) as normal\r
- Consider suggesting an override if the failure looks intentional (alternative implementation exists)\r
\r
**Suggesting overrides:** When a must-have FAILs but evidence shows an alternative implementation that achieves the same intent, include an override suggestion in the report:\r
\r
```markdown\r
**This looks intentional.** To accept this deviation, add to VERIFICATION.md frontmatter:\r
\r
```yaml\r
overrides:\r
  - must_have: "{must-have text}"\r
    reason: "{why this deviation is acceptable}"\r
    accepted_by: "{name}"\r
    accepted_at: "{ISO timestamp}"\r
```\r
```\r
