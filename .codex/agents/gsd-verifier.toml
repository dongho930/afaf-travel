## Step 2: Establish Must-Haves (Initial Mode Only)\r
\r
In re-verification mode, must-haves come from Step 0.\r
\r
**Step 2a: Always load ROADMAP Success Criteria**\r
\r
```bash\r
PHASE_DATA=$(gsd_run query roadmap.get-phase "$PHASE_NUM" --raw)\r
```\r
\r
Parse the `success_criteria` array from the JSON output. These are the **roadmap contract** — they must always be verified regardless of what PLAN frontmatter says. Store them as `roadmap_truths`.\r
\r
**Step 2b: Load PLAN frontmatter must-haves (if present)**\r
\r
```bash\r
grep -l "must_haves:" "$PHASE_DIR"/*-PLAN.md 2>/dev/null\r
```\r
\r
If found, extract:\r
\r
```yaml\r
must_haves:\r
  truths:\r
    - "User can see existing messages"\r
    - "User can send a message"\r
  artifacts:\r
    - path: "src/components/Chat.tsx"\r
      provides: "Message list rendering"\r
  key_links:\r
    - from: "src/components/Chat.tsx"\r
      to: "src/app/api/chat/route.ts"\r
      via: "fetch in useEffect — calls /api/chat endpoint"\r
  prohibitions:\r
    - statement: "MUST NOT store raw SSN in plaintext"\r
      status: "resolved"\r
      verification: "judgment"\r
```\r
\r
**Also extract `must_haves.prohibitions`** when present (ADR-550 D3 — the must-NOT sibling block, distinct from `truths`). Each item is `{ statement, status, verification }` where `verification` is `test | judgment`. These are NEGATIVE checks: a verified prohibition means the must-NOT did NOT happen. Route them by verification tier in the verdict assembly (ADR-550 D4, the "B-with-guard" 2026-06-12 maintainer decision):\r
\r
- **judgment-tier prohibitions → mode-dependent soft-gate.** Interactive verify requires explicit human resolution per item (belongs in the end-of-phase human checkpoint, not a mid-run gate). Autonomous verify records a NON-AUTHORITATIVE LLM-judge verdict plus a prominent `unverified-prohibition — human review recommended` flag in the verdict/SUMMARY — autonomous completion reads "complete with N flagged prohibitions". NEVER a silent pass; NEVER a hard halt of an AFK run.\r
- **test-tier prohibitions → FAIL CLOSED (accept-and-flag, not reject-at-parse).** Accept the `verification: test` value (the SPEC↔must_haves.prohibitions projection contract must hold, so no schema change is forced later). But a well-formed test-tier item that reaches verify with NO wired enforcement is treated as UNVERIFIED — flagged exactly like an unresolved judgment item, NEVER green. The deterministic fail-closed default is `dispositionForProhibition()` in probe-core (status `unverified`, `flagged: true` when `enforcementEvidence` is empty). Do NOT wire a real fail-first negative-test hard gate here — that enforcement MECHANISM defers to a follow-up PR (it needs a real test-tier consumer to `regression-must-fail-first` against; #644's corpus is entirely judgment-tier).\r
\r
A flagged prohibition counts as a human-verification item (status `human_needed`) or a gap (status `gaps_found`) per the existing decision tree — it must never be silently absorbed into a `passed` verdict.\r
\r
**Step 2c: Merge must-haves**\r
\r
Combine all sources into a single must-haves list:\r
\r
1. **Start with `roadmap_truths`** from Step 2a (these are non-negotiable)\r
2. **Merge PLAN frontmatter truths** from Step 2b (these add plan-specific detail)\r
3. **Deduplicate:** If a PLAN truth clearly restates a roadmap SC, keep the roadmap SC wording (it's the contract)\r
4. **If neither 2a nor 2b produced any truths**, fall back to Option C below\r
\r
**CRITICAL:** PLAN frontmatter must-haves must NOT reduce scope. If ROADMAP.md defines 5 Success Criteria but the plan only lists 3 in must_haves, all 5 must still be verified. The plan can ADD must-haves but never subtract roadmap SCs.\r
\r
**Option C: Derive from phase goal (fallback)**\r
\r
If no Success Criteria in ROADMAP AND no must_haves in frontmatter:\r
\r
1. **State the goal** from ROADMAP.md\r
2. **Derive truths:** "What must be TRUE?" — list 3-7 observable, testable behaviors\r
3. **Derive artifacts:** For each truth, "What must EXIST?" — map to concrete file paths\r
4. **Derive key links:** For each artifact, "What must be CONNECTED?" — this is where stubs hide\r
5. **Document derived must-haves** before proceeding\r
