## Exploration Process\r
\r
### Step 1: Orientation\r
\r
Glob for project structure indicators:\r
- `**/package.json`, `**/tsconfig.json`, `**/pyproject.toml`, `**/*.csproj`\r
- `**/Dockerfile`, `**/.github/workflows/*`\r
- Entry points: `**/index.*`, `**/main.*`, `**/app.*`, `**/server.*`\r
\r
### Step 2: Stack Detection\r
\r
Read package.json, configs, and build files. Write `stack.json`. Then patch its timestamp:\r
```bash\r
_GSD_SHIM_NAME="gsd-tools.cjs"; _GSD_RUNTIME_ROOT="${RUNTIME_DIR:-$(git rev-parse --show-toplevel 2>/dev/null || pwd)}"; GSD_TOOLS="${_GSD_RUNTIME_ROOT}/gsd-core/bin/${_GSD_SHIM_NAME}"; _gsd_at() { for _p; do if [ -f "$_p" ]; then GSD_TOOLS="$_p"; return 0; fi; done; return 1; }; if _gsd_at "${_GSD_RUNTIME_ROOT}/gsd-core/bin/${_GSD_SHIM_NAME}" "${_GSD_RUNTIME_ROOT}/.Codex/gsd-core/bin/${_GSD_SHIM_NAME}" "${_GSD_RUNTIME_ROOT}/.codex/gsd-core/bin/${_GSD_SHIM_NAME}"; then gsd_run() { node "$GSD_TOOLS" "$@"; }; elif unset -f gsd_run; _G="$(command -v gsd_run)"; then GSD_TOOLS="$_G"; gsd_run() { "$GSD_TOOLS" "$@"; }; elif _gsd_at "${CLAUDE_CONFIG_DIR:-C:/Users/zakuv/Downloads/afaf-travel-planner/afaf-travel/.Codex}/gsd-core/bin/${_GSD_SHIM_NAME}" "${HERMES_HOME:-$HOME/.hermes}/gsd-core/bin/${_GSD_SHIM_NAME}" "${CURSOR_CONFIG_DIR:-$HOME/.cursor}/gsd-core/bin/${_GSD_SHIM_NAME}" "${CODEX_HOME:-$HOME/.codex}/gsd-core/bin/${_GSD_SHIM_NAME}" "${GEMINI_CONFIG_DIR:-$HOME/.gemini}/gsd-core/bin/${_GSD_SHIM_NAME}" "${COPILOT_CONFIG_DIR:-$HOME/.copilot}/gsd-core/bin/${_GSD_SHIM_NAME}" "${WINDSURF_CONFIG_DIR:-$HOME/.codeium/windsurf}/gsd-core/bin/${_GSD_SHIM_NAME}" "${AUGMENT_CONFIG_DIR:-$HOME/.augment}/gsd-core/bin/${_GSD_SHIM_NAME}" "${TRAE_CONFIG_DIR:-$HOME/.trae}/gsd-core/bin/${_GSD_SHIM_NAME}" "${QWEN_CONFIG_DIR:-$HOME/.qwen}/gsd-core/bin/${_GSD_SHIM_NAME}" "${CODEBUDDY_CONFIG_DIR:-$HOME/.codebuddy}/gsd-core/bin/${_GSD_SHIM_NAME}" "${CLINE_CONFIG_DIR:-$HOME/.cline}/gsd-core/bin/${_GSD_SHIM_NAME}" "${GROK_AGENTS_HOME:-$HOME/.agents}/gsd-core/bin/${_GSD_SHIM_NAME}" "${ANTIGRAVITY_CONFIG_DIR:-$HOME/.gemini/antigravity}/gsd-core/bin/${_GSD_SHIM_NAME}" "${OPENCODE_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/opencode}/gsd-core/bin/${_GSD_SHIM_NAME}" "${KILO_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/kilo}/gsd-core/bin/${_GSD_SHIM_NAME}"; then gsd_run() { node "$GSD_TOOLS" "$@"; }; else echo "ERROR: gsd-tools.cjs not found at $GSD_TOOLS and gsd_run is not on PATH. Run: npx -y @opengsd/gsd-core@latest --Codex --local" >&2; exit 1; fi; GSD_IDENTITY_STATUS=unverified; case "$(gsd_run runtime-identity --raw 2>/dev/null || true)" in '{"packageName":"@opengsd/gsd-core"'*'}') GSD_IDENTITY_STATUS=ok;; esac; export GSD_IDENTITY_STATUS; [ "$GSD_IDENTITY_STATUS" = ok ] || echo "WARNING: \\"$GSD_TOOLS\\" did not prove it is @opengsd/gsd-core - it is either a different package or an @opengsd/gsd-core older than the runtime-identity verb. See docs/how-to/diagnose-a-foreign-gsd-tools.md" >&2; if [ -n "${CLAUDE_ENV_FILE:-}" ] && [ -n "${GSD_TOOLS:-}" ]; then printf "export PATH='%s':\\"\\$PATH\\"\\n" "${GSD_TOOLS%/*}" >> "$CLAUDE_ENV_FILE" 2>/dev/null || true; fi\r
gsd_run intel patch-meta .planning/intel/stack.json \r
```\r
\r
### Step 3: File Graph\r
\r
Glob source files (`**/*.ts`, `**/*.js`, `**/*.py`, etc., excluding node_modules/dist/build).\r
Read key files (entry points, configs, core modules) for imports/exports.\r
Write `file-roles.json`. Then patch its timestamp:\r
```bash\r
gsd_run intel patch-meta .planning/intel/file-roles.json \r
```\r
\r
Focus on files that matter -- entry points, core modules, configs. Skip test files and generated code unless they reveal architecture.\r
\r
### Step 4: API Surface\r
\r
Grep for route definitions, endpoint declarations, CLI command registrations.\r
Patterns to search: `app.get(`, `router.post(`, `@GetMapping`, `def route`, express route patterns.\r
Write `api-map.json`. If no API endpoints found, write an empty entries object. Then patch its timestamp:\r
```bash\r
gsd_run intel patch-meta .planning/intel/api-map.json \r
```\r
\r
### Step 5: Dependencies\r
\r
Read package.json (dependencies, devDependencies), requirements.txt, go.mod, Cargo.toml.\r
Cross-reference with actual imports to populate `used_by`.\r
Write `dependency-graph.json`. Then patch its timestamp:\r
```bash\r
gsd_run intel patch-meta .planning/intel/dependency-graph.json \r
```\r
\r
### Step 6: Architecture\r
\r
Synthesize patterns from steps 2-5 into structured JSON.\r
Write `arch-decisions.json` with the JSON schema defined in the Intel File Schemas section above. Then patch its timestamp:\r
```bash\r
gsd_run intel patch-meta .planning/intel/arch-decisions.json\r
```\r
\r
### Step 6.5: Self-Check\r
\r
Run: `gsd_run intel validate`\r
\r
Review the output:\r
\r
- If `valid: true`: proceed to Step 7\r
- If errors exist: fix the indicated files before proceeding\r
- Common fixes: replace descriptive exports with actual symbol names, fix stale timestamps\r
\r
This step is MANDATORY -- do not skip it.\r
\r
### Step 7: Snapshot\r
\r
Run: `gsd_run intel snapshot`\r
\r
This writes `.last-refresh.json` with accurate timestamps and hashes. Do NOT write `.last-refresh.json` manually.\r
</execution_flow>\r
\r
## Partial Updates\r
\r
When `focus: partial --files <paths>` is specified:\r
1. Only update entries in file-roles.json/api-map.json/dependency-graph.json that reference the given paths\r
2. Do NOT rewrite stack.json or arch-decisions.json (these need full context)\r
3. Preserve existing entries not related to the specified paths\r
4. Read existing intel files first, merge updates, write back\r
\r
## Output Budget\r
\r
| File | Target | Hard Limit |\r
|------|--------|------------|\r
| file-roles.json | <=2000 tokens | 3000 tokens |\r
| api-map.json | <=1500 tokens | 2500 tokens |\r
| dependency-graph.json | <=1000 tokens | 1500 tokens |\r
| stack.json | <=500 tokens | 800 tokens |\r
| arch-decisions.json | <=1500 tokens | 2000 tokens |\r
\r
For large codebases, prioritize coverage of key files over exhaustive listing. Include the most important 50-100 source files in file-roles.json rather than attempting to list every file.\r
\r
<success_criteria>\r
- [ ] All 5 intel files written to .planning/intel/\r
- [ ] All JSON files are valid, parseable JSON\r
- [ ] All entries reference actual file paths verified by Glob/Read\r
- [ ] .last-refresh.json written with hashes\r
- [ ] Completion marker returned\r
</success_criteria>\r
\r
<structured_returns>\r
## Completion Protocol\r
\r
CRITICAL: Your final output MUST end with exactly one completion marker.\r
Orchestrators pattern-match on these markers to route results. Omitting causes silent failures.\r
\r
- `## INTEL UPDATE COMPLETE` - all intel files written successfully\r
- `## INTEL UPDATE FAILED` - could not complete analysis (disabled, empty project, errors)\r
</structured_returns>\r
\r
<critical_rules>\r
\r
### Context Quality Tiers\r
\r
| Budget Used | Tier | Behavior |\r
|------------|------|----------|\r
| 0-30% | PEAK | Explore freely, read broadly |\r
| 30-50% | GOOD | Be selective with reads |\r
| 50-70% | DEGRADING | Write incrementally, skip non-essential |\r
| 70%+ | POOR | Finish current file and return immediately |\r
\r
</critical_rules>\r
\r
<anti_patterns>\r
\r
## Anti-Patterns\r
\r
1. DO NOT guess or assume -- read actual files for evidence\r
2. DO NOT use Bash for file listing -- use Glob tool\r
3. DO NOT read files in node_modules, .git, dist, or build directories\r
4. DO NOT include secrets or credentials in intel output\r
5. DO NOT write placeholder data -- every entry must be verified\r
6. DO NOT exceed output budget -- prioritize key files over exhaustive listing\r
7. DO NOT commit the output -- the orchestrator handles commits\r
8. DO NOT consume more than 50% context before producing output -- write incrementally\r
\r
</anti_patterns>"""
