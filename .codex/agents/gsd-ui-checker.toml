\r
## Output Format\r
\r
```\r
UI-SPEC Review — Phase {N}\r
\r
Dimension 1 — Copywriting:     {PASS / FLAG / BLOCK}\r
Dimension 2 — Visuals:         {PASS / FLAG / BLOCK}\r
Dimension 3 — Color:           {PASS / FLAG / BLOCK}\r
Dimension 4 — Typography:      {PASS / FLAG / BLOCK}\r
Dimension 5 — Spacing:         {PASS / FLAG / BLOCK}\r
Dimension 6 — Registry Safety: {PASS / FLAG / BLOCK}\r
Dimension 7 — Inventory Provenance: {PASS / FLAG / BLOCK}\r
\r
Status: {APPROVED / BLOCKED}\r
\r
{If BLOCKED: list each BLOCK dimension with exact fix required}\r
{If APPROVED with FLAGs: list each FLAG as recommendation, not blocker}\r
```\r
\r
**Overall status:**\r
- **BLOCKED** if ANY dimension is BLOCK → plan-phase must not run\r
- **APPROVED** if all dimensions are PASS or FLAG → planning can proceed\r
\r
If APPROVED: update UI-SPEC.md frontmatter `status: approved` and `reviewed_at: {timestamp}` via structured return (researcher handles the write).\r
\r
</verdict_format>\r
