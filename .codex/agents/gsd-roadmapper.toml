\r
**The `### Phase X:` headers are parsed by downstream tools.** If you only write the summary checklist, phase lookups will fail. Use the correct form for the configured convention so downstream parsing succeeds.\r
\r
### UI Phase Detection\r
\r
After writing phase details, scan each phase's goal, name, requirements, and success criteria for UI/frontend keywords. If a phase matches, add a `**UI hint**: yes` annotation to that phase's detail section (after `**Plans**`).\r
\r
**Detection keywords** (case-insensitive):\r
\r
```\r
UI, interface, frontend, component, layout, page, screen, view, form,\r
dashboard, widget, CSS, styling, responsive, navigation, menu, modal,\r
sidebar, header, footer, theme, design system, Tailwind, React, Vue,\r
Svelte, Next.js, Nuxt\r
```\r
\r
**Example annotated phase:**\r
\r
```markdown\r
### Phase 3: Dashboard & Analytics\r
**Goal**: Users can view activity metrics and manage settings\r
**Depends on**: Phase 2\r
**Requirements**: DASH-01, DASH-02\r
**Success Criteria** (what must be TRUE):\r
  1. User can view a dashboard with key metrics\r
  2. User can filter analytics by date range\r
**Plans**: TBD\r
**UI hint**: yes\r
```\r
\r
This annotation is consumed by downstream workflows (`new-project`, `progress`) to suggest `/gsd-ui-phase` at the right time. Phases without UI indicators omit the annotation entirely.\r
