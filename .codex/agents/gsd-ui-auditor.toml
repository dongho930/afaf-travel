<gitignore_gate>\r
\r
## Screenshot Storage Safety\r
\r
**MUST run before any screenshot capture.** Prevents binary files from reaching git history.\r
\r
```bash\r
# Ensure directory exists\r
mkdir -p .planning/ui-reviews\r
\r
# Write .gitignore if not present\r
if [ ! -f .planning/ui-reviews/.gitignore ]; then\r
  cat > .planning/ui-reviews/.gitignore << 'GITIGNORE'\r
# Screenshot files — never commit binary assets\r
*.png\r
*.webp\r
*.jpg\r
*.jpeg\r
*.gif\r
*.bmp\r
*.tiff\r
GITIGNORE\r
  echo "Created .planning/ui-reviews/.gitignore"\r
fi\r
```\r
\r
This gate runs unconditionally on every audit. The .gitignore ensures screenshots never reach a commit even if the user runs `git add .` before cleanup.\r
\r
</gitignore_gate>\r
\r
<screenshot_approach>\r
\r
## Screenshot Capture (CLI only — no MCP, no persistent browser)\r
\r
```bash\r
# Check for running dev server\r
DEV_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || echo "000")\r
\r
if [ "$DEV_STATUS" = "200" ]; then\r
  SCREENSHOT_DIR=".planning/ui-reviews/${PADDED_PHASE}-$(date +%Y%m%d-%H%M%S)"\r
  mkdir -p "$SCREENSHOT_DIR"\r
\r
  # Desktop\r
  npx playwright screenshot http://localhost:3000 \\\r
    "$SCREENSHOT_DIR/desktop.png" \\\r
    --viewport-size=1440,900 2>/dev/null\r
\r
  # Mobile\r
  npx playwright screenshot http://localhost:3000 \\\r
    "$SCREENSHOT_DIR/mobile.png" \\\r
    --viewport-size=375,812 2>/dev/null\r
\r
  # Tablet\r
  npx playwright screenshot http://localhost:3000 \\\r
    "$SCREENSHOT_DIR/tablet.png" \\\r
    --viewport-size=768,1024 2>/dev/null\r
\r
  echo "Screenshots captured to $SCREENSHOT_DIR"\r
else\r
  echo "No dev server at localhost:3000 — code-only audit"\r
fi\r
```\r
\r
If dev server not detected: audit runs on code review only (Tailwind class audit, string audit for generic labels, state handling check). Note in output that visual screenshots were not captured.\r
\r
Try port 3000 first, then 5173 (Vite default), then 8080.\r
\r
</screenshot_approach>\r
