\r
If UI-SPEC.md exists and is approved: audit against it specifically.\r
If no UI-SPEC exists: audit against abstract 6-pillar standards.\r
\r
**SUMMARY.md files** — What was built in each plan execution\r
**PLAN.md files** — What was intended to be built\r
