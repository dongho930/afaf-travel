<audit_pillars>\r
\r
## 6-Pillar Scoring (1-4 per pillar)\r
\r
**Score definitions:**\r
- **4** — Excellent: No issues found, exceeds contract\r
- **3** — Good: Minor issues, contract substantially met\r
- **2** — Needs work: Notable gaps, contract partially met\r
- **1** — Poor: Significant issues, contract not met\r
\r
### Pillar 1: Copywriting\r
\r
**Audit method:** Grep for string literals, check component text content.\r
\r
```bash\r
# Find generic labels\r
grep -rn "Submit\\|Click Here\\|OK\\|Cancel\\|Save" src --include="*.tsx" --include="*.jsx" 2>/dev/null\r
# Find empty state patterns\r
grep -rn "No data\\|No results\\|Nothing\\|Empty" src --include="*.tsx" --include="*.jsx" 2>/dev/null\r
# Find error patterns\r
grep -rn "went wrong\\|try again\\|error occurred" src --include="*.tsx" --include="*.jsx" 2>/dev/null\r
```\r
\r
**If UI-SPEC exists:** Compare each declared CTA/empty/error copy against actual strings.\r
**If no UI-SPEC:** Flag generic patterns against UX best practices.\r
\r
### Pillar 2: Visuals\r
\r
**Audit method:** Check component structure, visual hierarchy indicators.\r
\r
- Is there a clear focal point on the main screen?\r
- Are icon-only buttons paired with aria-labels or tooltips?\r
- Is there visual hierarchy through size, weight, or color differentiation?\r
\r
### Pillar 3: Color\r
\r
**Audit method:** Grep Tailwind classes and CSS custom properties.\r
\r
```bash\r
# Count accent color usage\r
grep -rn "text-primary\\|bg-primary\\|border-primary" src --include="*.tsx" --include="*.jsx" 2>/dev/null | wc -l\r
# Check for hardcoded colors\r
grep -rn "#[0-9a-fA-F]\\{3,8\\}\\|rgb(" src --include="*.tsx" --include="*.jsx" 2>/dev/null\r
```\r
\r
**If UI-SPEC exists:** Verify accent is only used on declared elements.\r
**If no UI-SPEC:** Flag accent overuse (>10 unique elements) and hardcoded colors.\r
\r
### Pillar 4: Typography\r
\r
**Audit method:** Grep font size and weight classes.\r
\r
```bash\r
# Count distinct font sizes in use\r
grep -rohn "text-\\(xs\\|sm\\|base\\|lg\\|xl\\|2xl\\|3xl\\|4xl\\|5xl\\)" src --include="*.tsx" --include="*.jsx" 2>/dev/null | sort -u\r
# Count distinct font weights\r
grep -rohn "font-\\(thin\\|light\\|normal\\|medium\\|semibold\\|bold\\|extrabold\\)" src --include="*.tsx" --include="*.jsx" 2>/dev/null | sort -u\r
```\r
\r
**If UI-SPEC exists:** Verify only declared sizes and weights are used.\r
**If no UI-SPEC:** Flag if >4 font sizes or >2 font weights in use.\r
\r
### Pillar 5: Spacing\r
\r
**Audit method:** Grep spacing classes, check for non-standard values.\r
\r
```bash\r
# Find spacing classes\r
grep -rohn "p-\\|px-\\|py-\\|m-\\|mx-\\|my-\\|gap-\\|space-" src --include="*.tsx" --include="*.jsx" 2>/dev/null | sort | uniq -c | sort -rn | head -20\r
# Check for arbitrary values\r
grep -rn "\\[.*px\\]\\|\\[.*rem\\]" src --include="*.tsx" --include="*.jsx" 2>/dev/null\r
```\r
\r
**If UI-SPEC exists:** Verify spacing matches declared scale.\r
**If no UI-SPEC:** Flag arbitrary spacing values and inconsistent patterns.\r
\r
### Pillar 6: Experience Design\r
\r
**Audit method:** Check for state coverage and interaction patterns.\r
\r
```bash\r
# Loading states\r
grep -rn "loading\\|isLoading\\|pending\\|skeleton\\|Spinner" src --include="*.tsx" --include="*.jsx" 2>/dev/null\r
# Error states\r
grep -rn "error\\|isError\\|ErrorBoundary\\|catch" src --include="*.tsx" --include="*.jsx" 2>/dev/null\r
# Empty states\r
grep -rn "empty\\|isEmpty\\|no.*found\\|length === 0" src --include="*.tsx" --include="*.jsx" 2>/dev/null\r
```\r
\r
Score based on: loading states present, error boundaries exist, empty states handled, disabled states for actions, confirmation for destructive actions.\r
\r
</audit_pillars>\r
\r
<registry_audit>\r
\r
## Registry Safety Audit (post-execution)\r
\r
**Run AFTER pillar scoring, BEFORE writing UI-REVIEW.md.** Only runs if `components.json` exists AND UI-SPEC.md lists third-party registries.\r
\r
```bash\r
# Check for shadcn and third-party registries\r
test -f components.json || echo "NO_SHADCN"\r
```\r
\r
**If shadcn initialized:** Parse UI-SPEC.md Registry Safety table for third-party entries (any row where Registry column is NOT "shadcn official").\r
\r
For each third-party block listed:\r
\r
```bash\r
# View the block source — captures what was actually installed\r
npx shadcn view {block} --registry {registry_url} 2>/dev/null > /tmp/shadcn-view-{block}.txt\r
\r
# Check for suspicious patterns\r
grep -nE "fetch\\(|XMLHttpRequest|navigator\\.sendBeacon|process\\.env|eval\\(|Function\\(|new Function|import\\(.*https?:" /tmp/shadcn-view-{block}.txt 2>/dev/null\r
\r
# Diff against local version — shows what changed since install\r
npx shadcn diff {block} 2>/dev/null\r
```\r
\r
**Suspicious pattern flags:**\r
- `fetch(`, `XMLHttpRequest`, `navigator.sendBeacon` — network access from a UI component\r
- `process.env` — environment variable exfiltration vector\r
- `eval(`, `Function(`, `new Function` — dynamic code execution\r
- `import(` with `http:` or `https:` — external dynamic imports\r
- Single-character variable names in non-minified source — obfuscation indicator\r
\r
**If ANY flags found:**\r
- Add a **Registry Safety** section to UI-REVIEW.md BEFORE the "Files Audited" section\r
- List each flagged block with: registry URL, flagged lines with line numbers, risk category\r
- Score impact: deduct 1 point from Experience Design pillar per flagged block (floor at 1)\r
- Mark in review: `⚠️ REGISTRY FLAG: {block} from {registry} — {flag category}`\r
\r
**If diff shows changes since install:**\r
- Note in Registry Safety section: `{block} has local modifications — diff output attached`\r
- This is informational, not a flag (local modifications are expected)\r
\r
**If no third-party registries or all clean:**\r
- Note in review: `Registry audit: {N} third-party blocks checked, no flags`\r
\r
**If shadcn not initialized:** Skip entirely. Do not add Registry Safety section.\r
\r
</registry_audit>\r
