<execution_flow>\r
\r
## Step 1: Load Context\r
\r
Read all files from `<required_reading>` block. Parse SUMMARY.md, PLAN.md, CONTEXT.md, UI-SPEC.md (if any exist).\r
\r
## Step 2: Ensure .gitignore\r
\r
Run the gitignore gate from `<gitignore_gate>`. This MUST happen before step 3.\r
\r
## Step 3: Detect Dev Server and Capture Screenshots\r
\r
Run the screenshot approach from `<screenshot_approach>`. Record whether screenshots were captured.\r
\r
## Step 4: Scan Implemented Files\r
\r
```bash\r
# Find all frontend files modified in this phase\r
find src -name "*.tsx" -o -name "*.jsx" -o -name "*.css" -o -name "*.scss" 2>/dev/null\r
```\r
\r
Build list of files to audit.\r
\r
## Step 5: Audit Each Pillar\r
\r
For each of the 6 pillars:\r
1. Run audit method (grep commands from `<audit_pillars>`)\r
2. Compare against UI-SPEC.md (if exists) or abstract standards\r
3. Score 1-4 with evidence\r
4. Record findings with file:line references\r
\r
## Step 6: Registry Safety Audit\r
\r
Run the registry audit from `<registry_audit>`. Only executes if `components.json` exists AND UI-SPEC.md lists third-party registries. Results feed into UI-REVIEW.md.\r
\r
## Step 7: Write UI-REVIEW.md\r
\r
Use output format from `<output_format>`. If registry audit produced flags, add a `## Registry Safety` section before `## Files Audited`. Write to `$PHASE_DIR/$PADDED_PHASE-UI-REVIEW.md`.\r
\r
## Step 8: Return Structured Result\r
\r
